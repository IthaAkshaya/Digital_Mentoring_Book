function saveMentorRemark(id, n) {
  const s = stu(id);
  if (!s || !canView(s)) return toast('Not allowed', 1);
  const r = s.recs[n];
  if (!r) return toast('Record not found', 1);
  const f = me() || {};
  const txtIn = document.getElementById('mentor_remark_input_' + n);
  const note = txtIn ? txtIn.value.trim() : '';
  if (!note) return toast('Please type remarks before posting.', 1);

  r.remarks = note;
  r.remarksBy = f.name || s.mentorName;
  r.remarksEmail = f.email || s.mentorEmail || '';
  r.remarksDate = now();
  r.t = now();
  s.upd = now();

  if (!r.hist) r.hist = [];
  r.hist.push({
    t: now(),
    by: f.id || 'faculty',
    byName: f.name || s.mentorName,
    byEmail: f.email || s.mentorEmail || '',
    action: 'Remark Posted',
    note
  });

  notify(s.roll, `Mentor ${f.name || s.mentorName} posted remarks on Semester ${n}: "${note.slice(0, 70)}${note.length > 70 ? '...' : ''}"`, f.name || s.mentorName, f.email || s.mentorEmail);
  audit(f.id || 'faculty', 'Remark posted', `${s.roll} Sem ${n}`);
  syncStudentToAliases(s);
  save();
  toast('Remarks posted! Student can now see this in their portal.');
  app();
}

function act(id, n, a) {
  const s = stu(id);
  if (!s || !canView(s)) return toast('Not allowed: this student is not assigned to you.', 1);
  const r = s.recs[n], by = ss.id;
  const facultyUser = fac(by) || me() || {};
  const facultyName = facultyUser.name || s.mentorName || by;
  const facultyEmail = facultyUser.email || s.mentorEmail || '';
  const txtIn = document.getElementById('mentor_remark_input_' + n);
  let note = txtIn ? txtIn.value.trim() : '';
  let st = r.status, actName = '';

  if (a === 'corr' || a === 'reopen') {
    if (!note) {
      note = prompt(a === 'corr' ? 'What must the student correct? (required)' : 'Reason for reopening (required)');
    }
    if (!(note || '').trim()) return;
  }

  if (a === 'verify') {
    st = 'Under Verification';
    actName = 'Verification started';
    if (note) {
      r.remarks = note;
      r.remarksBy = facultyName;
      r.remarksEmail = facultyEmail;
      r.remarksDate = now();
    }
  }
  if (a === 'corr' || a === 'reopen') {
    st = 'Correction Required';
    actName = 'Correction required';
    r.corr = note.trim();
    r.remarks = 'Correction Required: ' + note.trim();
    r.remarksBy = facultyName;
    r.remarksEmail = facultyEmail;
    r.remarksDate = now();
  }
  const commitAct = (finalSt, finalActName) => {
    r.status = finalSt;
    r.t = now();
    s.upd = now();
    r.hist.push({ t: now(), by, byName: facultyName, byEmail: facultyEmail, action: finalActName, note: (note || '').trim() });

    notify(s.roll, a === 'cert' ? `Semester ${n} record was certified by ${facultyName}.` : a === 'remark' ? `New remark on Semester ${n} by ${facultyName}.` : a === 'verify' ? `Semester ${n} is under verification.` : `Correction required for Semester ${n}: ${note.trim()}`, facultyName, facultyEmail);
    audit(by, finalActName, `${s.roll} Sem ${n}`);
    syncStudentToAliases(s);
    save();
    toast(finalActName + ' recorded');
    app();
  };

  if (a === 'cert') {
    openConfirmModal({
      title: `Certify Semester ${n} for ${s.name}?`,
      message: `You are officially certifying this mentee's academic performance marks. The record will be sealed with your faculty verification stamp.`,
      details: `🎓 <b>${esc(s.name)}</b> (${esc(s.roll)}) · <b>${esc(s.branch)}</b> · Sec ${esc(s.section)}<br><small style="color:var(--mut)">Faculty Mentor: <b>${esc(facultyName)}</b> (${esc(facultyEmail)})</small>`,
      icon: '✓',
      iconType: 'success',
      confirmText: '✓ Officially Certify Record',
      cancelText: 'Cancel',
      confirmClass: 'btn ok modal-primary-btn',
      onConfirm: () => {
        justCert = id + n;
        r.corr = '';
        if (note) {
          r.remarks = note;
          r.remarksBy = facultyName;
          r.remarksEmail = facultyEmail;
          r.remarksDate = now();
        } else if (!r.remarks) {
          r.remarks = `Semester ${n} academic marks reviewed, verified, and officially certified by Faculty Mentor ${facultyName}.`;
          r.remarksBy = facultyName;
          r.remarksEmail = facultyEmail;
          r.remarksDate = now();
        }
        if (!s.mentorRemarks) s.mentorRemarks = [];
        s.mentorRemarks.unshift({
          t: now(),
          by,
          byName: facultyName,
          byEmail: facultyEmail,
          note: r.remarks,
          scope: `Semester ${n} Certified`
        });
        commitAct('Certified', 'Certified');
      }
    });
    return;
  }

  commitAct(st, actName);
}

/* Quick Mentor Email Editing on Student Side */
function toggleQuickMentorEmailEdit() {
  const box = document.getElementById('quick_mentor_edit_box');
  if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

function onQuickMentorEmailInput(emailVal) {
  const clean = (emailVal || '').toLowerCase().trim();
  const nameEl = document.getElementById('qm_name');
  const pwEl = document.getElementById('qm_pw');
  if (pwEl) pwEl.value = '';
  if (!clean) return;
  
  const f = db.fac.find(x => (x.email || '').toLowerCase() === clean);
  if (f) {
    if (nameEl) nameEl.value = f.name;
    return;
  }
  
  if (nameEl) {
    if (clean.includes('gopi')) {
      nameEl.value = 'Dr. Gopi Sir';
    } else if (clean.includes('@')) {
      const handle = clean.split('@')[0];
      const formatted = handle.replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      nameEl.value = 'Prof. ' + formatted;
    }
  }
}

function pickQuickMentor(email, name) {
  const emEl = document.getElementById('qm_email');
  const nameEl = document.getElementById('qm_name');
  const pwEl = document.getElementById('qm_pw');
  if (emEl) emEl.value = email;
  if (nameEl) nameEl.value = name;
  if (pwEl) pwEl.value = '';
}

function syncQuickMentorEmail() {
  const mName = document.getElementById('qm_name')?.value.trim() || '';
  const f = db.fac.find(x => x.name.toLowerCase() === mName.toLowerCase());
  const emEl = document.getElementById('qm_email');
  if (f && f.email && emEl) emEl.value = f.email;
}

function saveQuickMentorEmail(e) {
  e.preventDefault();
  const s = me();
  if (!s) return false;
  const newEmail = (document.getElementById('qm_email')?.value || '').trim().toLowerCase();
  let newName = (document.getElementById('qm_name')?.value || '').trim();
  let newPw = (document.getElementById('qm_pw')?.value || '').trim();

  if (!newEmail || !newEmail.includes('@')) return toast('Please enter a valid mentor email address.', 1), false;

  if (!newName) {
    if (newEmail.includes('gopi')) newName = 'Dr. Gopi Sir';
    else {
      const handle = newEmail.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      newName = 'Prof. ' + handle;
    }
  }
  if (!newPw) {
    let existingF = db.fac.find(f => (f.email && f.email.toLowerCase() === newEmail) || f.name.toLowerCase() === newName.toLowerCase());
    newPw = (existingF && existingF.pw) || getUniquePwForEmail(newEmail);
  }

  s.mentorName = newName;
  s.mentorEmail = newEmail;

  let matchedFac = db.fac.find(f => (f.email && f.email.toLowerCase() === newEmail) || f.name.toLowerCase() === newName.toLowerCase());
  if (!matchedFac) {
    const cleanId = newEmail.split('@')[0].replace(/\W+/g, '') || newName.replace(/\W+/g, '');
    matchedFac = { id: 'F_' + cleanId, name: newName, email: newEmail, dept: s.branch || 'DATA SCIENCE (CSE)', pw: newPw };
    db.fac.push(matchedFac);
  } else {
    matchedFac.name = newName;
    matchedFac.email = newEmail;
    matchedFac.pw = newPw;
  }
  s.mentor = matchedFac.id;
  s.upd = now();

  syncStudentToAliases(s);
  audit(s.roll, 'Mentor Email Updated', `Changed to ${newName} (${newEmail})`);
  save();
  showTopMessage(`Sir's Email Updated!`, `Official Email: ${newEmail} · Name: ${newName}`);
  toast(`✓ Sir's email updated: ${newEmail}`);
  app();
  return false;
}

/* Faculty Reminder / Messaging System for Unsubmitted Students */
function openReminderModal(roll) {
  const s = stu(roll);
  if (!s) return;
  const f = me() || {};
  let modalEl = document.getElementById('reminder-modal');
  if (!modalEl) {
    modalEl = document.createElement('div');
    modalEl.id = 'reminder-modal';
    document.body.appendChild(modalEl);
  }
  
  const missingSems = sems(s).filter(n => !s.recs[n] || ['Not started', 'Draft'].includes(s.recs[n].status));
  const semNotice = missingSems.length ? `Semester ${missingSems.join(', ')}` : `Semester ${s.sem}`;

  modalEl.innerHTML = `
    <div style="position:fixed;inset:0;background:rgba(10,31,68,0.65);backdrop-filter:blur(3px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem" onclick="if(event.target===this)closeReminderModal()">
      <div style="background:var(--paper);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.3);max-width:580px;width:100%;border:2px solid var(--ink2);overflow:hidden;animation:fadeIn .2s ease">
        <div style="background:var(--ink);color:#fff;padding:1.1rem 1.4rem;display:flex;justify-content:space-between;align-items:center">
          <div>
            <h3 style="margin:0;font-size:1.15rem;color:#fff">✉️ Send Message / Reminder to Student</h3>
            <small style="color:#93c5fd">Official Mentor Notice from <b>${esc(f.name)}</b> (${esc(f.email)})</small>
          </div>
          <button type="button" style="background:none;border:0;color:#fff;font-size:1.4rem;cursor:pointer;padding:.2rem;line-height:1" onclick="closeReminderModal()">✕</button>
        </div>
        <div style="padding:1.3rem">
          <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:.8rem 1rem;margin-bottom:1rem;display:flex;align-items:center;gap:.8rem">
            ${avatar(s)}
            <div>
              <b style="font-size:1.05rem;color:var(--ink2)">${esc(s.name)}</b> (${esc(s.roll)})<br>
              <span style="font-size:12.5px;color:var(--mut)">Branch: ${esc(s.branch)} · Sec ${esc(s.section || 'A')} · Unsubmitted: <b>${esc(semNotice)}</b></span>
            </div>
          </div>

          <label style="font-weight:700;font-size:12.5px;margin-bottom:.4rem;display:block;color:var(--tx)">
            ⚡ Quick 1-Click Reminder Templates:
          </label>
          <div style="display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem">
            <button type="button" class="btn alt sm" style="text-align:left;justify-content:flex-start" onclick="setReminderText('Dear ${esc(s.name)}, please enter your Mid 1, Mid 2 and Semester marks and submit your Digital Mentor Book immediately.')">
              📋 "Please enter your Mid 1, Mid 2 and Semester marks and submit immediately."
            </button>
            <button type="button" class="btn alt sm" style="text-align:left;justify-content:flex-start" onclick="setReminderText('Dear ${esc(s.name)}, your ${esc(semNotice)} records are still unsubmitted. Complete your marks entry so mentor verification can proceed.')">
              ⏳ "Your records are still unsubmitted. Complete marks entry for verification."
            </button>
            <button type="button" class="btn alt sm" style="text-align:left;justify-content:flex-start" onclick="setReminderText('URGENT: Submit your pending semester marks in the Digital Mentor Book before the faculty review deadline.')">
              🚨 "URGENT: Submit your pending semester marks before the deadline."
            </button>
            <button type="button" class="btn alt sm" style="text-align:left;justify-content:flex-start" onclick="setReminderText('Dear ${esc(s.name)}, please meet me at the faculty room / cabin during mentor counseling hour regarding your mentor book.')">
              🤝 "Please meet me at the faculty room regarding your mentor book."
            </button>
          </div>

          <label for="reminder_msg_in" style="font-weight:700;font-size:12.5px;margin-bottom:.3rem;display:block;color:var(--tx)">
            Customize Message to Student:
          </label>
          <textarea id="reminder_msg_in" rows="3" style="width:100%;padding:.6rem .8rem;border:1.5px solid var(--line);border-radius:6px;font-size:13.5px;box-sizing:border-box" placeholder="Type your reminder message for the student here..."></textarea>

          <div class="row" style="margin-top:1.2rem;justify-content:flex-end;gap:.6rem">
            <button type="button" class="btn alt" onclick="closeReminderModal()">Cancel</button>
            <button type="button" class="btn" style="background:#2563eb" onclick="sendStudentReminder('${s.roll}', document.getElementById('reminder_msg_in').value)">📤 Send Message to Student</button>
          </div>
        </div>
      </div>
    </div>
  `;
  setTimeout(() => {
    const txt = document.getElementById('reminder_msg_in');
    if (txt) {
      txt.value = `Dear ${s.name}, please enter your Mid 1, Mid 2, and Semester marks for ${semNotice} and submit your Digital Mentor Book for verification.`;
      txt.focus();
    }
  }, 40);
}

function setReminderText(txt) {
  const el = document.getElementById('reminder_msg_in');
  if (el) el.value = txt;
}

function closeReminderModal() {
  const m = document.getElementById('reminder-modal');
  if (m) m.innerHTML = '';
}

function sendStudentReminder(roll, msgText) {
  const s = stu(roll);
  if (!s) return toast('Student not found', 1);
  const f = me() || {};
  const facultyName = f.name || 'Faculty Mentor';
  const facultyEmail = f.email || '';
  if (!msgText || !msgText.trim()) return toast('Please type or select a message.', 1);

  const cleanMsg = msgText.trim();
  if (!s.messages) s.messages = [];
  s.messages.unshift({
    t: now(),
    from: facultyName,
    fromEmail: facultyEmail,
    msg: cleanMsg
  });

  notify(s.roll, cleanMsg, facultyName, facultyEmail);
  audit(f.id || facultyEmail || 'faculty', 'Reminder Sent', `Message to ${s.roll} (${s.name}): "${cleanMsg.slice(0, 45)}"`);
  save();
  toast(`Reminder message sent to ${s.name} (${s.roll})!`);
  closeReminderModal();
  app();
}

function claimMentee(roll) {
  const s = stu(roll);
  if (!s) return;
  const f = me() || {};
  s.mentor = f.id;
  s.mentorName = f.name;
  s.mentorEmail = f.email;
  s.upd = now();
  save();
  audit(f.id || f.email || 'faculty', 'Claimed Mentee', `${s.roll} (${s.name}) linked to ${f.email}`);
  toast(`Linked ${s.name} (${s.roll}) to your mentorship email (${f.email})!`);
  app();
}

function onStudentMailInput(val) {
  const badge = document.getElementById('fq_matched_badge');
  if (!badge) return;
  const str = (val || '').trim().toLowerCase();
  if (!str) {
    badge.innerHTML = 'Type or select a student email above';
    return;
  }
  const s = db.stu.find(x => (x.email && x.email.toLowerCase() === str) ||
                             x.roll.toLowerCase() === str ||
                             (str.includes('@') && x.email && x.email.toLowerCase().includes(str)) ||
                             x.name.toLowerCase().includes(str));
  if (s) {
    const unsubmitted = sems(s).filter(n => !s.recs[n] || ['Not started', 'Draft'].includes(s.recs[n].status));
    badge.innerHTML = `<b style="color:var(--ink2)">${esc(s.name)}</b> (${esc(s.roll)}) · <b>${esc(s.branch)}</b><br><span style="color:${unsubmitted.length ? '#b45309' : '#15803d'};font-size:12px">${unsubmitted.length ? '⚠️ Unsubmitted Semesters: ' + unsubmitted.join(', ') : '✓ All semesters submitted'}</span>`;
  } else {
    badge.innerHTML = `<span style="color:var(--mut)">New / Custom student address: <b>${esc(str)}</b></span>`;
  }
}

function setQuickEmailTemplate(type) {
  const mailIn = document.getElementById('fq_student_mail')?.value.trim() || '';
  const s = db.stu.find(x => (x.email && x.email.toLowerCase() === mailIn.toLowerCase()) || x.roll.toLowerCase() === mailIn.toLowerCase());
  const sName = s ? s.name : 'Student';
  const f = me() || {};
  const subIn = document.getElementById('fq_subject');
  const bodyIn = document.getElementById('fq_body');

  if (type === 1) {
    if (subIn) subIn.value = `[SNIST Digital Mentor Book] Pending Semester Marks Submission Reminder`;
    if (bodyIn) bodyIn.value = `Dear ${sName},\n\nThis is a notification from your Faculty Mentor (${f.name || 'Faculty'}). Your semester marks and attendance have not yet been submitted in the Digital Mentor Book.\n\nPlease log in to your portal immediately, fill in your Mid 1, Mid 2, Internal and Semester marks, and click 'Submit for Verification' so your record can be reviewed and certified.\n\nRegards,\n${f.name || 'Faculty Mentor'}\n${f.email || ''}\nSreenidhi Institute of Science & Technology`;
  } else if (type === 2) {
    if (subIn) subIn.value = `[URGENT] Digital Mentor Book Submission Deadline Approaching`;
    if (bodyIn) bodyIn.value = `Dear ${sName},\n\nURGENT NOTICE: The deadline for submitting your B.Tech Academic Mentor Book is approaching. You currently have pending/unsubmitted semester records.\n\nPlease complete your marks entry and submit today to avoid missing the departmental verification cutoff.\n\nRegards,\n${f.name || 'Faculty Mentor'}\n${f.email || ''}\nSNIST`;
  } else if (type === 3) {
    if (subIn) subIn.value = `[Counseling Notice] Meet Faculty Mentor regarding Mentor Book`;
    if (bodyIn) bodyIn.value = `Dear ${sName},\n\nPlease meet me at the faculty cabin/department staff room during the mentor counseling hour tomorrow regarding your academic progress and unsubmitted mentor book records.\n\nRegards,\n${f.name || 'Faculty Mentor'}\n${f.email || ''}\nSNIST`;
  }
}

function openMailStudent(studentRollOrEmail) {
  const s = stu(studentRollOrEmail) || db.stu.find(x => x.email && x.email.toLowerCase() === String(studentRollOrEmail).toLowerCase());
  const mailIn = document.getElementById('fq_student_mail');
  if (mailIn) {
    mailIn.value = s ? (s.email || (s.roll.toLowerCase() + '@sreenidhi.edu.in')) : studentRollOrEmail;
    onStudentMailInput(mailIn.value);
    setQuickEmailTemplate(1);
    mailIn.scrollIntoView({ behavior: 'smooth', block: 'center' });
    mailIn.focus();
  } else {
    openReminderModal(s ? s.roll : studentRollOrEmail);
  }
}

function handleFacultyQuickEmail(e) {
  if (e) e.preventDefault();
  const mailIn = document.getElementById('fq_student_mail')?.value.trim() || '';
  const subIn = document.getElementById('fq_subject')?.value.trim() || 'SNIST Digital Mentor Book Notice';
  const bodyIn = document.getElementById('fq_body')?.value.trim() || '';

  if (!mailIn) return toast('Please enter the student email address.', 1), false;
  if (!bodyIn) return toast('Please type a message body to send.', 1), false;

  const f = me() || {};
  const facultyName = f.name || 'Faculty Mentor';
  const facultyEmail = f.email || '';

  const s = db.stu.find(x => (x.email && x.email.toLowerCase() === mailIn.toLowerCase()) ||
                             x.roll.toLowerCase() === mailIn.toLowerCase() ||
                             (mailIn.includes('@') && x.email && x.email.toLowerCase().includes(mailIn.toLowerCase())));

  if (s) {
    if (!s.messages) s.messages = [];
    s.messages.unshift({
      t: now(),
      from: facultyName,
      fromEmail: facultyEmail,
      subject: subIn,
      msg: bodyIn
    });
    notify(s.roll, `[Email Sent] ${subIn}: ${bodyIn.slice(0, 60)}`, facultyName, facultyEmail);
    audit(f.id || facultyEmail, 'Email & Message Sent', `To ${s.roll} (${mailIn}): ${subIn}`);
  } else {
    notify('all', `[Notice to ${mailIn}] ${subIn}`, facultyName, facultyEmail);
    audit(f.id || facultyEmail, 'Email Sent', `To ${mailIn}: ${subIn}`);
  }

  save();

  // Dispatch via Resend API as well
  fetch('/api/send-email', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      type: 'faculty_message',
      to: mailIn,
      mentorName: facultyName,
      subject: subIn,
      body: bodyIn
    })
  }).then(r => r.json()).then(res => {
    if (res && res.ok) {
      toast(`📧 Real Email dispatched via Resend to ${res.sentTo}!`);
    }
  }).catch(() => {});

  const mailtoUri = `mailto:${encodeURIComponent(mailIn)}?subject=${encodeURIComponent(subIn)}&body=${encodeURIComponent(bodyIn)}`;
  const win = window.open(mailtoUri, '_blank');
  if (!win) {
    const a = document.createElement('a');
    a.href = mailtoUri;
    a.click();
  }

  toast(`✓ Message delivered to student portal and email dispatched for ${mailIn}!`);
  app();
  return false;
}

function openDirectGmail() {
  const mailIn = document.getElementById('fq_student_mail')?.value.trim() || '';
  const subIn = document.getElementById('fq_subject')?.value.trim() || '';
  const bodyIn = document.getElementById('fq_body')?.value.trim() || '';
  if (!mailIn) return toast('Enter student email first.', 1);
  const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(mailIn)}&su=${encodeURIComponent(subIn)}&body=${encodeURIComponent(bodyIn)}`;
  window.open(gmailUrl, '_blank');
  toast('Opening Gmail compose tab for ' + mailIn);
}

function openDefaultMailClient() {
  const mailIn = document.getElementById('fq_student_mail')?.value.trim() || '';
  const subIn = document.getElementById('fq_subject')?.value.trim() || '';
  const bodyIn = document.getElementById('fq_body')?.value.trim() || '';

}

function closeRemarksModal() {
  const el = document.getElementById('remarks-modal');
  if (el) el.remove();
}

function setModalRemarkText(t) {
  const el = document.getElementById('modal_remark_textarea');
  if (el) { el.value = t; el.focus(); }
}

function setInlineRemark(n, txt) {
  const el = document.getElementById('mentor_remark_input_' + n);
  if (el) { el.value = txt; el.focus(); }
}

function onRemarkTargetChange(roll, targetVal) {
  const s = stu(roll);
  if (!s) return;
  const el = document.getElementById('modal_remark_textarea');
  if (!el) return;
  if (targetVal === 'overall') {
    const lastOverall = (s.mentorRemarks && s.mentorRemarks.length) ? s.mentorRemarks[0].note : '';
    el.value = lastOverall;
  } else {
    const r = s.recs && s.recs[+targetVal];
    el.value = r ? (r.remarks || '') : '';
  }
}

function saveModalRemarks(roll) {
  const s = stu(roll);
  if (!s || !canView(s)) return toast('Not allowed', 1);
  const f = me() || {};
  const facultyName = f.name || s.mentorName || 'Faculty Mentor';
  const facultyEmail = f.email || s.mentorEmail || '';
  const targetEl = document.getElementById('modal_remark_target');
  const target = targetEl ? targetEl.value : 'overall';
  const textEl = document.getElementById('modal_remark_textarea');
  const note = textEl ? textEl.value.trim() : '';
  if (!note) return toast('Please enter remarks before saving.', 1);

  if (target === 'overall') {
    if (!s.mentorRemarks) s.mentorRemarks = [];
    s.mentorRemarks.unshift({
      t: now(),
      by: f.id || 'faculty',
      byName: facultyName,
      byEmail: facultyEmail,
      note,
      scope: 'Overall Counseling'
    });
    notify(s.roll, `Faculty Mentor ${facultyName} posted counseling remarks: "${note.slice(0, 70)}${note.length > 70 ? '...' : ''}"`, facultyName, facultyEmail);
    audit(f.id || 'faculty', 'Mentor remarks posted', `${s.roll} - Overall Counseling`);
  } else {
    const n = +target;
    if (!s.recs[n]) {
      s.recs[n] = {
        subjects: makeDefaultSubjects(n, s.branch),
        gpa: '',
        cgpa: '',
        status: 'Draft',
        t: now(),
        hist: []
      };
    }
    const r = s.recs[n];
    r.remarks = note;
    r.remarksBy = facultyName;
    r.remarksEmail = facultyEmail;
    r.remarksDate = now();
    r.t = now();
    if (!r.hist) r.hist = [];
    r.hist.push({
      t: now(),
      by: f.id || 'faculty',
      byName: facultyName,
      byEmail: facultyEmail,
      action: 'Remark Posted',
      note
    });
    notify(s.roll, `Faculty Mentor ${facultyName} posted remarks on Semester ${n}: "${note.slice(0, 70)}${note.length > 70 ? '...' : ''}"`, facultyName, facultyEmail);
    audit(f.id || 'faculty', 'Remark posted', `${s.roll} Sem ${n}`);
  }

  s.upd = now();
  syncStudentToAliases(s);

  save();
  closeRemarksModal();
  toast('✓ Remarks posted! Instantly visible on student portal.');
  app();
}

function onQuickRemarkStudentInput(val) {
  const badge = document.getElementById('qr_matched_badge');
  const scopeWrap = document.getElementById('qr_scope_wrap');
  if (!badge) return;
  const str = (val || '').trim();
  if (!str) {
    badge.innerHTML = 'Select a student above to load their record and existing remarks';
    return;
  }
  const s = findStudentByAny(str);
  if (s) {
    badge.innerHTML = `<b style="color:var(--ink2)">${esc(s.name)}</b> (${esc(s.roll)}) · <b>${esc(s.branch)}</b> (Sec ${esc(s.section || 'A')}) · <span class="badge" style="background:${s.entry === 'Lateral' ? '#dcfce7;color:#15803d' : '#e0f2fe;color:#0369a1'}">${s.entry || 'Regular'} Entry</span> · Current: <b>Sem ${s.sem}</b>`;
    if (scopeWrap) {
      const available = sems(s);
      scopeWrap.innerHTML = `
        <label for="qr_target_scope" style="font-weight:700;color:var(--tx);margin:0 0 .2rem">Remark Target / Scope:</label>
        <select id="qr_target_scope" onchange="onQuickRemarkScopeChange()">
          <option value="overall">🌟 Overall Counseling &amp; Academic Observation</option>
          ${available.map(n => `<option value="${n}" ${s.sem === n ? 'selected' : ''}>Semester ${n} Record Remarks ${s.recs[n] ? `(${s.recs[n].status})` : '(Unsubmitted)'}</option>`).join('')}
        </select>
      `;
    }
    onQuickRemarkScopeChange();
  } else {
    badge.innerHTML = `<span style="color:var(--mut)">Student matching "${esc(str)}" not found in records.</span>`;
  }
}

function onQuickRemarkScopeChange() {
  const rollIn = document.getElementById('qr_student_roll')?.value.trim() || '';
  const s = findStudentByAny(rollIn);
  if (!s) return;
  const scopeEl = document.getElementById('qr_target_scope');
  const scopeVal = scopeEl ? scopeEl.value : 'overall';
  const bodyEl = document.getElementById('qr_body');
  if (!bodyEl) return;
  if (scopeVal === 'overall') {
    bodyEl.value = (s.mentorRemarks && s.mentorRemarks.length) ? s.mentorRemarks[0].note : '';
  } else {
    const r = s.recs && s.recs[+scopeVal];
    bodyEl.value = r ? (r.remarks || '') : '';
  }
}

function setQuickRemarkTemplate(type) {
  const rollIn = document.getElementById('qr_student_roll')?.value.trim() || '';
  const s = findStudentByAny(rollIn);
  const sName = s ? s.name : 'Student';
  const bodyEl = document.getElementById('qr_body');
  if (!bodyEl) return;

  if (type === 1) {
    bodyEl.value = `Outstanding academic dedication by ${sName}. Displays strong conceptual understanding in core theory subjects and excellent lab proficiency.`;
  } else if (type === 2) {
    bodyEl.value = `Good progress observed. Recommended that ${sName} focuses more on internal examination assessments and numerical problem solving.`;
  } else if (type === 3) {
    bodyEl.value = `Attendance is currently below the required 75% benchmark. Advised ${sName} to attend all scheduled classes, tutorials, and mentoring sessions regularly.`;
  } else if (type === 4) {
    bodyEl.value = `One-on-one mentor counseling conducted with ${sName} in faculty cabin. Discussed academic goals, semester targets, and daily study schedule.`;
  }
  bodyEl.focus();
}

function handleQuickMentorRemarksSubmit(e) {
  if (e) e.preventDefault();
  const rollIn = document.getElementById('qr_student_roll')?.value.trim() || '';
  const s = findStudentByAny(rollIn);
  if (!s) return toast('Please select a valid student first.', 1), false;

  const scopeEl = document.getElementById('qr_target_scope');
  const target = scopeEl ? scopeEl.value : 'overall';
  const bodyEl = document.getElementById('qr_body');
  const note = bodyEl ? bodyEl.value.trim() : '';
  if (!note) return toast('Please enter remarks before saving.', 1), false;

  const f = me() || {};
  const facultyName = f.name || s.mentorName || 'Faculty Mentor';
  const facultyEmail = f.email || s.mentorEmail || '';

  if (target === 'overall') {
    if (!s.mentorRemarks) s.mentorRemarks = [];
    s.mentorRemarks.unshift({
      t: now(),
      by: f.id || 'faculty',
      byName: facultyName,
      byEmail: facultyEmail,
      note,
      scope: 'Overall Counseling'
    });
    notify(s.roll, `Faculty Mentor ${facultyName} posted counseling remarks: "${note.slice(0, 70)}${note.length > 70 ? '...' : ''}"`, facultyName, facultyEmail);
    audit(f.id || 'faculty', 'Mentor remarks posted', `${s.roll} - Overall Counseling`);
  } else {
    const n = +target;
    if (!s.recs[n]) {
      s.recs[n] = {
        subjects: makeDefaultSubjects(n, s.branch),
        gpa: '',
        cgpa: '',
        status: 'Draft',
        t: now(),
        hist: []
      };
    }
    const r = s.recs[n];
    r.remarks = note;
    r.remarksBy = facultyName;
    r.remarksEmail = facultyEmail;
    r.remarksDate = now();
    r.t = now();
    if (!r.hist) r.hist = [];
    r.hist.push({
      t: now(),
      by: f.id || 'faculty',
      byName: facultyName,
      byEmail: facultyEmail,
      action: 'Remark Posted',
      note
    });
    if (!s.mentorRemarks) s.mentorRemarks = [];
    s.mentorRemarks.unshift({
      t: now(),
      by: f.id || 'faculty',
      byName: facultyName,
      byEmail: facultyEmail,
      note,
      scope: `Semester ${n} Record`
    });
    notify(s.roll, `Faculty Mentor ${facultyName} posted remarks on Semester ${n}: "${note.slice(0, 70)}${note.length > 70 ? '...' : ''}"`, facultyName, facultyEmail);
    audit(f.id || 'faculty', 'Remark posted', `${s.roll} Sem ${n}`);
  }

  s.upd = now();
  syncStudentToAliases(s);

  save();
  toast(`✓ Remarks saved for ${s.name} (${s.roll})! Visible in student portal.`);
  app();
  return false;
}

/* Print Mentor Book */

  const s = ss.role === 'student' ? u : stu(sel);
  if (!s || !canView(s)) return '<div class="empty">Not authorized.</div>';
  const mName = s.mentorName || (fac(s.mentor) || {}).name || '________________';

  return `<p class="noprint">
    <button class="btn" onclick="window.print()">🖨️ Print / Save as Official PDF</button>
    <button class="btn alt sm" onclick="go('dash')">Back</button>
  </p>
  <div class="page" style="text-align:center;border-bottom:3px double var(--ink)">
    <h2 style="margin:0;font-size:1.6rem">Sreenidhi Institute of Science &amp; Technology</h2>
    <div style="font-size:12px;color:var(--mut)">Autonomous Institution · Affiliated to JNTUH · Yamnampet, Ghatkesar, Hyderabad</div>
    <h3 style="margin:.4em 0 0;color:var(--ink2)">DIGITAL MENTOR BOOK</h3>
    <div style="font-size:13px;font-weight:700">Department: ${esc(s.branch)}</div>
    <div style="font-size:12.5px;color:var(--mut);margin-top:.2em">Assigned Faculty Mentor: <b>${esc(mName)}</b> · Official Email: <b>${esc(s.mentorEmail || (fac(s.mentor)||{}).email || '—')}</b></div>
    <div style="font-size:13px;margin-top:.35em"><b>Name of the Student:</b> ${esc(s.name)} · <b>Gender:</b> ${esc(s.gender || '—')} · <b>Hall Ticket / Roll:</b> ${esc(s.roll)} · <b>Admission:</b> <span class="badge" style="background:${s.entry === 'Lateral' ? '#dcfce7;color:#15803d' : '#e0f2fe;color:#0369a1'};font-size:11px;font-weight:700">${s.entry || 'Regular'} Entry</span></div>
    <small>Document Generated on ${fmt(now())}</small>
  </div>
  ${profCard(s)}
  <h3>Academic Records (${s.entry === 'Lateral' ? 'Lateral Entry: Semesters 3 to 8' : 'Regular Entry: Semesters 1 to 8'})</h3>
  ${sems(s).map(n => s.recs[n] ? recForm(s, n, false) : `<div class="sem"><h4>Semester ${n}</h4><p style="color:var(--mut);font-size:13px">${s.entry === 'Lateral' && n < 3 ? 'Exempted (Lateral Entry Direct 2nd Year Admission)' : 'No records submitted.'}</p></div>`).join('')}
  
  <div class="page">
    <h3>Mentor Remarks &amp; Institutional Endorsement</h3>
    ${reviewsFor(s).filter(h => h.by !== s.roll).map(remHtml).join('') || '<p style="color:var(--mut)">No remarks recorded.</p>'}
    <div class="row" style="justify-content:space-between;margin-top:4rem;padding-top:1rem;border-top:1px dashed var(--line)">
      <div style="text-align:center">
        <b>_______________________</b><br>
        <span>Student Signature</span>
      </div>
      <div style="text-align:center">
        <b>${esc(mName)}</b><br>
        <small style="color:var(--mut)">${esc(s.mentorEmail || '')}</small><br>
        <span>Faculty Mentor Signature</span>
      </div>
      <div style="text-align:center">
        <b>_______________________</b><br>
        <span>Head of the Department (HOD)</span>
      </div>
    </div>
  </div>`;
}

/* Admin Views */
function assignView() {
  return `<h2>Faculty Mentor Assignments</h2>
  <div class="note">Manage student mentor allocations and official verification emails across branches and sections.</div>
  <div class="tw">
    <table>
      <thead>
        <tr>
          <th>Roll No.</th>
          <th>Student Name</th>
          <th>Branch</th>
          <th>Section</th>
          <th>Assigned Mentor Name</th>
          <th>Mentor Verification Email</th>
        </tr>
      </thead>
      <tbody>
        ${db.stu.map(s => `<tr>
          <td><b>${esc(s.roll)}</b></td>
          <td>${esc(s.name)}</td>
          <td><small>${esc(s.branch)}</small></td>
          <td><span class="badge" style="background:#fef3c7;color:#92400e">Sec ${esc(s.section || 'A')}</span></td>
          <td>
            <input id="as_name_${s.roll}" value="${esc(s.mentorName || (fac(s.mentor)||{}).name || '')}" list="mentorSuggestions" style="max-width:180px;padding:.3em .5em" placeholder="Mentor Name" onchange="const f = db.fac.find(x => x.name.toLowerCase() === this.value.trim().toLowerCase()); if(f && f.email) document.getElementById('as_email_${s.roll}').value = f.email; assignName('${s.roll}')">
          </td>
          <td>
            <input id="as_email_${s.roll}" value="${esc(s.mentorEmail || (fac(s.mentor)||{}).email || '')}" style="max-width:230px;padding:.3em .5em" placeholder="faculty@sreenidhi.edu.in" onchange="assignName('${s.roll}')">
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>
  <h3 style="margin-top:1.4rem">Mentee Allocation by Faculty Email</h3>
  <div class="grid">
    ${db.fac.map(f => {
      const cnt = db.stu.filter(s => s.mentor === f.id || (f.email && s.mentorEmail && s.mentorEmail.toLowerCase() === f.email.toLowerCase()) || (s.mentorName && s.mentorName.toLowerCase() === f.name.toLowerCase())).length;
      return `<div class="card">
        <b>${cnt} Mentees</b>
        <span>${esc(f.name)} (${esc(f.id)})</span>
        <small style="color:var(--mut);display:block;margin-top:2px">${esc(f.email || 'No email')}</small>
      </div>`;
    }).join('')}
  </div>`;
}

function assignName(roll) {
  const s = stu(roll);
  if (!s) return;
  const nameEl = document.getElementById('as_name_' + roll);
  const emailEl = document.getElementById('as_email_' + roll);
  const newName = nameEl ? nameEl.value.trim() : s.mentorName;
  const newEmail = emailEl ? emailEl.value.trim().toLowerCase() : (s.mentorEmail || '');
  if (!newName) return;
  const old = s.mentorName;
  s.mentorName = newName;
  s.mentorEmail = newEmail;
  let matchedFac = db.fac.find(f => (newEmail && f.email && f.email.toLowerCase() === newEmail) || f.name.toLowerCase() === newName.toLowerCase());
  if (!matchedFac) {
    matchedFac = { id: 'F_' + newName.replace(/\W+/g, ''), name: newName, email: newEmail, dept: s.branch, pw: 'demo123' };
    db.fac.push(matchedFac);
  } else if (newEmail) {
    matchedFac.email = newEmail;
  }
  s.mentor = matchedFac.id;
  audit('admin', 'Mentor assigned', `${roll}: ${old || 'none'} → ${newName} (${newEmail})`);
  save();
  toast(`Mentor assigned: ${newName} (${newEmail})`);
}

function cfgView() {
  return `<h2>Academic Grading Configuration</h2>
  <div class="card" style="max-width:440px">
    <form onsubmit="return saveCfg(event)">
      <label>Maximum Mid 1 Marks</label>
      <input id="cm1" type="number" min="1" step="1" value="${db.cfg.m1}" required>
      <label>Maximum Mid 2 Marks</label>
      <input id="cm2" type="number" min="1" step="1" value="${db.cfg.m2}" required>
      <label>Maximum Semester Exam Marks</label>
      <input id="cse" type="number" min="1" step="1" value="${db.cfg.se}" required>
      <label>Maximum GPA / CGPA Scale</label>
      <input id="cgpa_scale" type="number" min="1" step="0.1" value="10" required>
      <button class="btn" style="margin-top:1rem">Save Configuration</button>
    </form>
  </div>`;
}

function saveCfg(e) {
  e.preventDefault();
  db.cfg.m1 = +cm1.value;
  db.cfg.m2 = +cm2.value;
  db.cfg.se = +cse.value;
  audit('admin', 'Grading rules updated', '');
  save();
  toast('Grading rules saved');
  return false;
}

function logView() {
  return `<h2>System Audit Log</h2>
  ${db.log.length ? `<div class="tw"><table><thead><tr><th>Timestamp</th><th>Actor</th><th>Action</th><th>Details</th></tr></thead><tbody>${db.log.slice(0, 100).map(l => `<tr><td>${fmt(l.t)}</td><td><b>${esc(l.by)}</b></td><td>${esc(l.act)}</td><td>${esc(l.det)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No audit events recorded.</div>'}
  <p style="margin-top:1.2rem">
    <button class="btn alt sm bad" onclick="openConfirmModal({ title: 'Reset Demo Data to Defaults?', message: 'Are you sure you want to revert all students, mentors, marks, and audit logs back to SNIST defaults?', details: '⚠️ All custom edits made in this browser will be wiped and freshly reset.', icon: '↻', iconType: 'danger', confirmText: 'Reset Demo Data', cancelText: 'Cancel', confirmClass: 'btn bad modal-danger-btn', onConfirm: () => { localStorage.removeItem('dmb'); location.reload(); } })">Reset Demo Data to SNIST Defaults</button>
  </p>`;
}

app();
</script>
