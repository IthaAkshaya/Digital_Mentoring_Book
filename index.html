<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sreenidhi Institute of Science & Technology - Digital Mentor Book</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --ink: #0a1f44;
  --ink2: #143b7d;
  --accent: #d97706;
  --accent-light: #fef3c7;
  --sky: #ebf3ff;
  --paper: #ffffff;
  --bg: #f3f5f9;
  --line: #d2dae8;
  --tx: #162033;
  --mut: #54647d;
  --ok: #0d825c;
  --warn: #b45309;
  --bad: #b42318;
  box-sizing: border-box;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141c2c;--bg:#0b111e;--line:#26344d;--tx:#e3e9f5;--mut:#8fa0bd;--sky:#192742;--ink:#081329;--ink2:#2856a3
  }
}
:root[data-theme="dark"]{
  --paper:#141c2c;--bg:#0b111e;--line:#26344d;--tx:#e3e9f5;--mut:#8fa0bd;--sky:#192742;--ink:#081329;--ink2:#2856a3
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 'Public Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3,h4{font-family:Bitter,Georgia,serif;margin:0 0 .35em;line-height:1.2;color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f5a524;outline-offset:2px}
.btn{background:var(--ink2);color:#fff;border:0;padding:.55em 1.15em;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:.4em;transition:background .15s}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:transparent;color:var(--ink2);border:1.5px solid var(--ink2)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}.btn.sm{padding:.3em .7em;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;padding:.5em .7em;border:1.5px solid var(--line);border-radius:7px;background:var(--paper)}
label{display:block;font-weight:600;font-size:12.5px;margin:.6em 0 .2em;color:var(--mut)}
.err{color:var(--bad);font-size:12px;min-height:1em;margin-top:.2em}

/* header banner */
.snist-banner{background:linear-gradient(135deg,var(--ink) 0%,#1a3d82 100%);color:#fff;padding:.8rem 1.4rem;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--accent);box-shadow:0 2px 10px #0002}
.snist-title{display:flex;align-items:center;gap:1rem}
.snist-emblem{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--ink);font:800 1.3rem Bitter,serif;border:2px solid var(--accent);flex:none}
.snist-text h1{font-size:1.15rem;margin:0;letter-spacing:.02em}
.snist-text p{margin:0;font-size:11.5px;opacity:.88}

/* landing */
.land{min-height:calc(100vh - 65px);display:grid;grid-template-columns:1.1fr 1fr}
.spine{background:var(--ink);color:#fff;padding:6vw 5vw;display:flex;flex-direction:column;justify-content:center;position:relative}
.spine:after{content:"";position:absolute;right:0;top:0;bottom:0;width:12px;background:repeating-linear-gradient(#0000 0 20px,#ffffff25 20px 24px)}
.spine h1{font-size:clamp(1.9rem,4.5vw,3.2rem);font-weight:800}
.spine p{max-width:48ch;opacity:.88;font-size:15px;line-height:1.6}
.snist-tag{display:inline-block;padding:.25em .8em;border-radius:99px;background:var(--accent);color:#fff;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1rem;width:fit-content}
.feat{list-style:none;padding:0;margin:1.4rem 0 0;display:grid;gap:.5rem;font-size:13.5px}.feat li:before{content:"✓ ";color:#7fe0b5;font-weight:bold}
.leaf{padding:5vw 6vw;display:flex;flex-direction:column;justify-content:center;gap:1rem;background:var(--paper)}
.role{display:block;text-align:left;width:100%;padding:1.05em 1.2em;border:2px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;transition:border-color .2s,box-shadow .2s}
.role:hover{border-color:var(--ink2);box-shadow:0 3px 12px #0001}.role b{font:700 1.1rem Bitter,serif;display:block}.role span{color:var(--mut);font-size:12.5px}

/* shell */
.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
nav.side{background:var(--ink);color:#fff;padding:1.2rem .8rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:.3rem}
nav.side .brand{font:800 1.1rem Bitter,serif;padding:.3em .6em .8em;border-bottom:1px solid #ffffff25;margin-bottom:.5rem}
nav.side .brand small{display:block;font-size:11px;font-family:'Public Sans',sans-serif;font-weight:400;opacity:.85}
nav.side button{background:none;border:0;color:#cfdcf7;text-align:left;padding:.65em .8em;border-radius:8px;cursor:pointer;font-size:13.5px}
nav.side button.on,nav.side button:hover{background:#ffffff1f;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.4rem;background:var(--paper);border-bottom:1px solid var(--line);gap:.6rem;flex-wrap:wrap}
main{padding:1.3rem;max-width:1150px;width:100%}
.page{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1.4rem;position:relative;margin-bottom:1.1rem;box-shadow:0 1px 4px #0000000a}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1rem}
.card b{font:800 1.8rem Bitter,serif;display:block;color:var(--ink2)}.card span{color:var(--mut);font-size:12.5px}
.badge{display:inline-block;padding:.15em .65em;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--sky);color:var(--ink2)}
.b-Certified{background:#d6f3e6;color:var(--ok)}.b-Correction{background:#fde4e1;color:var(--bad)}.b-Under,.b-Submitted,.b-Resubmitted{background:#fdf0d2;color:var(--warn)}
table{width:100%;border-collapse:collapse;background:var(--paper)}
th,td{padding:.6em .65em;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px}
th{cursor:pointer;color:var(--mut);background:#f6f8fc;font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--ink2);color:#fff;display:grid;place-items:center;font-weight:700;object-fit:cover;flex:none}
.avatar.lg{width:80px;height:80px;font-size:1.7rem}
.row{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.f2{display:grid;gap:0 1rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.sem{border:1px solid var(--line);border-radius:10px;padding:1.1rem;background:var(--paper);margin-bottom:1.1rem;position:relative;box-shadow:0 1px 4px #00000008}
.bar{height:7px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:.4rem}.bar i{display:block;height:100%;background:var(--ink2)}
.stamp{position:absolute;right:1.2rem;top:1rem;border:3px double var(--ok);color:var(--ok);font:800 .95rem Bitter,serif;padding:.15em .7em;border-radius:6px;transform:rotate(-7deg);letter-spacing:.12em;pointer-events:none}
.stamp.new{animation:thump .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes thump{from{transform:scale(3) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(-7deg);opacity:1}}
#toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);display:grid;gap:.4rem;z-index:99}
#toast div{background:var(--tx);color:var(--paper);padding:.6em 1.2em;border-radius:8px;box-shadow:0 4px 18px #0004;font-weight:500;font-size:13px}
#toast .e{background:var(--bad);color:#fff}
.empty{padding:2.2rem;text-align:center;color:var(--mut);border:2px dashed var(--line);border-radius:10px}
.note{border-left:4px solid var(--ink2);background:var(--sky);padding:.6em .9em;border-radius:6px;margin:.5em 0}
.hide{display:none}.menu{display:none}

/* mentor notebook table style */
.mentor-table-wrap{margin:1rem 0;border:2px solid var(--line);border-radius:8px;overflow-x:auto}
.mentor-table{width:100%;border-collapse:collapse;background:var(--paper);min-width:680px}
.mentor-table th{background:var(--sky);color:var(--ink);font-weight:700;font-size:13px;border-bottom:2px solid var(--line);padding:.65em .7em}
.mentor-table td{padding:.45em .6em;border-bottom:1px solid var(--line);vertical-align:middle}
.mentor-table tfoot td{background:#f8fafc;font-weight:700;border-top:2px solid var(--line);padding:.6em .65em}
.mentor-table input.num-in{text-align:center;width:100%;max-width:76px;padding:.4em .25em;font-weight:600;box-sizing:border-box}
.mentor-table input.subj-in{min-width:170px;font-weight:500}
.mentor-summary-box{display:flex;gap:1.5rem;align-items:center;background:var(--sky);padding:.8rem 1.1rem;border-radius:8px;margin:.8rem 0;flex-wrap:wrap;border:1px solid var(--line)}
.mentor-summary-box .val-block{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:14px;color:var(--ink)}
.mentor-summary-box .val-block input{width:80px;text-align:center;font-weight:800;font-size:15px;padding:.35em .5em;background:#fff}

@media(max-width:850px){
  .land{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.menu{display:inline-block}
  nav.side{position:fixed;inset:0 20% 0 0;z-index:50;transform:translateX(-100%);transition:transform .2s;height:100%}
  nav.side.open{transform:none}
}
@media print{
  nav.side,.top,.noprint,#toast,.snist-banner{display:none!important}
  .shell{display:block}body{background:#fff;color:#000}
  .page,.sem{border:1px solid #aaa;box-shadow:none;margin-bottom:1.5rem;break-inside:avoid}
  .mentor-table th{background:#eee!important;color:#000!important}
}

/* Attractive Custom Dialog & Modal System */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(8, 19, 41, 0.65);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 9999;
  display: grid;
  place-items: center;
  padding: 1.2rem;
  animation: modalFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-backdrop.closing {
  animation: modalFadeOut 0.16s ease-out forwards;
}
.modal-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 25px 50px -12px rgba(10, 31, 68, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
  max-width: 460px;
  width: 100%;
  padding: 1.85rem;
  position: relative;
  animation: modalPopIn 0.26s cubic-bezier(0.175, 0.885, 0.32, 1.2);
}
.modal-backdrop.closing .modal-card {
  animation: modalPopOut 0.16s ease-out forwards;
}
@keyframes modalFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes modalFadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}
@keyframes modalPopIn {
  from { transform: scale(0.9) translateY(14px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}
@keyframes modalPopOut {
  from { transform: scale(1) translateY(0); opacity: 1; }
  to { transform: scale(0.94) translateY(8px); opacity: 0; }
}

.modal-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 1.65rem;
  flex: none;
  box-sizing: border-box;
}
.modal-icon-danger {
  background: #fee2e2;
  color: #b91c1c;
  border: 1.5px solid #fca5a5;
  box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.12);
}
.modal-icon-info {
  background: #e0f2fe;
  color: #0369a1;
  border: 1.5px solid #bae6fd;
  box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
}
.modal-icon-success {
  background: #dcfce7;
  color: #15803d;
  border: 1.5px solid #bbf7d0;
  box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.12);
}
.modal-icon-warning {
  background: #fef3c7;
  color: #b45309;
  border: 1.5px solid #fde68a;
  box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.12);
}

.modal-danger-btn {
  background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%) !important;
  color: #ffffff !important;
  border: 0 !important;
  box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
  transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
}
.modal-danger-btn:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(220, 38, 38, 0.45);
}
.modal-primary-btn {
  background: linear-gradient(135deg, #143b7d 0%, #0a1f44 100%) !important;
  color: #ffffff !important;
  border: 0 !important;
  box-shadow: 0 4px 14px rgba(20, 59, 125, 0.35);
  transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
}
.modal-primary-btn:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(20, 59, 125, 0.45);
}

/* Recovery Cards & Tabs System */
.recovery-method-card {
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.18s ease;
  text-align: left;
  width: 100%;
  color: var(--tx);
  box-sizing: border-box;
  text-decoration: none;
  position: relative;
}
.recovery-method-card:hover {
  border-color: var(--ink2);
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(10, 31, 68, 0.08);
}
.recovery-method-card:focus-visible {
  outline: 2.5px solid var(--accent);
  outline-offset: 2px;
}
.recovery-method-card .card-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 1.35rem;
  flex: none;
}
.recovery-method-card .card-body {
  flex: 1;
  min-width: 0;
}
.recovery-method-card .card-title {
  font-weight: 700;
  font-size: 13.5px;
  color: var(--tx);
  display: flex;
  align-items: center;
  gap: 6px;
  justify-content: space-between;
}
.recovery-method-card .card-desc {
  font-size: 12px;
  color: var(--mut);
  margin-top: 2px;
  line-height: 1.35;
}
.recovery-tab-btn {
  flex: 1;
  padding: 8px 12px;
  border: none;
  background: transparent;
  font-weight: 600;
  font-size: 13px;
  color: var(--mut);
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
}
.recovery-tab-btn.active {
  background: var(--ink2);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(20, 59, 125, 0.25);
}
</style>
</head>

const now = () => new Date().toISOString(), fmt = t => t ? new Date(t).toLocaleString([], { dateStyle:'medium', timeStyle:'short' }) : '—';

function calcInternal(m1, m2) {
  const v1 = (m1 !== '' && m1 !== undefined && m1 !== null) ? +m1 : null;
  const v2 = (m2 !== '' && m2 !== undefined && m2 !== null) ? +m2 : null;
  if (v1 === null && v2 === null) return '';
  if (v1 !== null && v2 !== null) {
    return Math.round(((v1 + v2) / 2) * 10) / 10;
  }
  return v1 !== null ? v1 : v2;
}

function calcTotal(internal, sem) {
  const i = (internal !== '' && internal !== undefined && internal !== null) ? +internal : null;
  const s = (sem !== '' && sem !== undefined && sem !== null) ? +sem : null;
  if (i === null && s === null) return '';
  return Math.round(((i || 0) + (s || 0)) * 10) / 10;
}

function calcGrade(total) {
  if (total === '' || total === null || isNaN(total)) return '';
  const t = +total;
  if (t >= 90) return 'O';
  if (t >= 80) return 'A+';
  if (t >= 70) return 'A';
  if (t >= 60) return 'B+';
  if (t >= 50) return 'B';
  if (t >= 40) return 'C';
  return 'F';
}

function makeDefaultSubjects(n, branch) {
  const br = branch || 'DATA SCIENCE (CSE)';
  if (n === 3 && BRANCH_SUBJECTS_SEM3[br]) {
    return BRANCH_SUBJECTS_SEM3[br].map(name => ({ name, m1: '', m2: '', internal: '', sem: '', total: '' }));

  if (DS_CURRICULUM[n]) {
    return DS_CURRICULUM[n].map(name => ({ name, m1: '', m2: '', internal: '', sem: '', total: '' }));
  }
  return [
    `Core Subject 1 (${br})`,
    `Core Subject 2 (${br})`,
    `Core Subject 3 (${br})`,
    `Professional Elective`,
    `Open Elective`,
    `Laboratory 1`,
    `Laboratory 2`
  ].map(name => ({ name, m1: '', m2: '', internal: '', sem: '', total: '' }));
}

function isMyNote(n) {

function findStudentByAny(query) {
  if (!query || !db || !db.stu) return null;
  const q = String(query).trim().toLowerCase();
  let found = db.stu.find(x => (x.roll || '').toLowerCase() === q);
  if (found) return found;
  found = db.stu.find(x => (x.email || '').toLowerCase() === q);
  if (found) return found;
  found = db.stu.find(x => (x.name || '').toLowerCase() === q);
  if (found) return found;
  found = db.stu.find(x => x.roll && q.includes(x.roll.toLowerCase()));
  if (found) return found;
  found = db.stu.find(x => x.email && q.includes(x.email.toLowerCase()));
  if (found) return found;
  found = db.stu.find(x => x.name && (x.name.toLowerCase().includes(q) || q.includes(x.name.toLowerCase())));
  return found || null;
}

const me = () => {
  if (!ss) return null;
  if (ss.role === 'student') {
    const sId = String(ss.id || '').toLowerCase().trim();
    const sEm = String(ss.email || '').toLowerCase().trim();
    return db.stu.find(s => (s.roll && s.roll.toLowerCase() === sId) ||
                            (s.email && s.email.toLowerCase() === sId) ||
                            (sEm && s.email && s.email.toLowerCase() === sEm) ||
                            (s.name && s.name.toLowerCase() === sId)) || db.stu[0];
  }
  if (ss.role === 'faculty') return fac(ss.id) || (ss.email ? fac(ss.email) : null) || db.fac.find(f => f.name.toLowerCase() === String(ss.id).toLowerCase());
  return db.adm;
};
const sems = s => s.entry === 'Lateral' ? SEMS.slice(2) : SEMS;
const stu = id => findStudentByAny(id);
const fac = id => {

                          (f.email && f.email.toLowerCase() === str) ||

};

function syncStudentToAliases(s) {
  if (!s || !db || !db.stu) return;

  const email = (s.email || '').toLowerCase().trim();

  db.stu.forEach(alias => {
    if (alias === s) return;

    const xName = (alias.name || '').toLowerCase().trim();
    const xEmail = (alias.email || '').toLowerCase().trim();

    const isMatch = (
      (roll === '23315a6701' && xRoll === '23cs001') ||
      (roll === '23cs001' && xRoll === '23315a6701') ||
      (roll === '24315a6714' && xRoll === '24cs014') ||
      (roll === '24cs014' && xRoll === '24315a6714') ||
      (name && xName === name) ||
      (email && xEmail === email)
    );

    if (isMatch) {
      if (s.recs) alias.recs = JSON.parse(JSON.stringify(s.recs));
      if (s.mentorRemarks) alias.mentorRemarks = JSON.parse(JSON.stringify(s.mentorRemarks));

      alias.mentorEmail = s.mentorEmail;
      alias.branch = s.branch;
      alias.section = s.section;
      alias.entry = s.entry;
      alias.sem = s.sem;
      alias.year = s.year;
      alias.admYear = s.admYear;
      alias.name = s.name;

      alias.perm = s.perm;

function canView(s) {
  const u = ss;

const pfields = ['name','gender','branch','section','mentorName','mentorEmail','admYear','year','sem','father','fOcc','fPh','mother','mOcc','mPh','cur','perm','goal'];
const pct = s => Math.round(100 * (pfields.filter(k => String(s[k] || '').trim()).length + (s.photo ? 1 : 0)) / (pfields.length + 1));
const avatar = (s, c = '') => s.photo ? `<img class="avatar ${c}" src="${s.photo}" alt="${esc(s.name)}">` : `<div class="avatar ${c}" aria-hidden="true">${esc(s.name ? s.name[0] : 'S')}</div>`;
const cgpa = s => { const k = sems(s).filter(n => s.recs[n] && s.recs[n].cgpa !== '' && s.recs[n].cgpa !== undefined).pop(); return k ? s.recs[k] : null; };

function getUniquePwForEmail(email) {
  if (!email) return 'demo123';
  const clean = String(email).toLowerCase().trim();
  const f = (typeof db !== 'undefined' && db && db.fac) ? db.fac.find(x => (x.email || '').toLowerCase() === clean) : null;
  if (f && f.pw) return f.pw;
  const s = (typeof db !== 'undefined' && db && db.stu) ? db.stu.find(x => (x.email || '').toLowerCase() === clean) : null;
  if (s && s.pw) return s.pw;
  const defMap = {
    'gopi.sir@sreenidhi.edu.in': 'gopi@123',
    'lakshmi.rao@sreenidhi.edu.in': 'lakshmi@123',
    'arjun.iyer@sreenidhi.edu.in': 'arjun@123',
    'jaffar.sadiq@sreenidhi.edu.in': 'jaffar@123',
    'ananya.22@sreenidhi.edu.in': 'ananya@123',
    'rahul.22@sreenidhi.edu.in': 'rahul@123'
  };
  if (defMap[clean]) return defMap[clean];
  const handle = clean.split('@')[0];
  const firstPart = handle.split('.')[0].replace(/\W+/g, '');
  if (firstPart) return firstPart + '@123';
  return 'snist@123';
}

function showEmailSuggestions(val, role) {
  const p = document.getElementById('p');
  if (p && !p.dataset.userEdited) p.value = '';

  const box = document.getElementById('emailSuggestBox');
  if (!box) return;
  const q = (val || '').trim().toLowerCase();
  
  let list = [];
  if (role === 'student') {
    list = (db.stu || []).map(s => ({
      email: s.email || (s.roll.toLowerCase() + '@sreenidhi.edu.in'),
      name: s.name || '',
      roll: s.roll || '',
      branch: s.branch || 'DATA SCIENCE (CSE)',
      badge: 'Student'
    }));
  } else if (role === 'faculty') {
    list = (db.fac || []).map(f => ({
      email: f.email || '',
      name: f.name || '',
      roll: f.id || '',
      branch: f.dept || '',
      badge: 'Faculty'
    }));
  }

  // Deduplicate by email
  const seen = new Set();
  list = list.filter(item => {
    if (!item.email || seen.has(item.email.toLowerCase())) return false;
    seen.add(item.email.toLowerCase());
    return true;
  });

  const matches = list.filter(item => {
    if (!q) return true;
    return item.email.toLowerCase().includes(q) ||
           item.name.toLowerCase().includes(q) ||
           item.roll.toLowerCase().includes(q);
  });

  if (!matches.length) {
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }

  box.innerHTML = `
    <div style="padding:6px 12px;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #e2e8f0;background:#f8fafc;border-top-left-radius:8px;border-top-right-radius:8px">
      Matching Accounts (${matches.length})
    </div>
    ${matches.map(m => `
      <div class="suggest-opt-item" onclick="selectSuggestedEmail('${esc(m.email)}')" style="padding:9px 12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f1f5f9;transition:background .15s" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='white'">
        <div>
          <div style="font-weight:700;font-size:13px;color:#1e293b">${esc(m.email)}</div>
          <div style="font-size:11.5px;color:#64748b">${esc(m.name)} · <b>${esc(m.roll)}</b></div>
        </div>
        <span style="font-size:11px;padding:3px 8px;border-radius:999px;background:#e0f2fe;color:#0369a1;font-weight:600">Select</span>
      </div>
    `).join('')}
  `;
  box.style.display = 'block';
}

function handleCardAltSubmit(e, role, action = 'signin') {
  if (e && e.preventDefault) e.preventDefault();
  const ident = (document.getElementById('alt_u')?.value || '').trim();

  if (errEl) errEl.textContent = '';

  if (!ident) {
    if (errEl) errEl.textContent = 'Please enter your roll number or college email.';
    return false;
  }

  const found = findAccountByIdentifier(ident, role);
  if (!found) {
    if (errEl) errEl.innerHTML = `⚠️ No account found matching "<b>${esc(ident)}</b>". Please check roll number or email.`;
    return false;
  }

  const u = found.data;
  const pin = (document.getElementById('alt_pin')?.value || '').trim().toUpperCase();

  // Verification check:
  let isVerified = false;
  if (pin === 'SNIST2025' || pin === 'GOPI2025' || pin === 'SNIST@ADMIN' || pin === 'ADMIN') {
    isVerified = true;
  } else if (found.type === 'student') {
    const branchInp = (document.getElementById('alt_branch')?.value || '').trim();
    const mentorInp = (document.getElementById('alt_mentor')?.value || '').trim().toLowerCase();
    const secInp = (document.getElementById('alt_sec')?.value || '').trim().toUpperCase();

    const uBranch = (u.branch || 'DATA SCIENCE (CSE)').trim();
    const uMentor = (u.mentorName || '').toLowerCase().trim();
    const uSec = (u.section || 'A').trim().toUpperCase();

    const bMatch = !branchInp || branchInp.toLowerCase() === uBranch.toLowerCase();
    const mMatch = !mentorInp || uMentor.includes(mentorInp) || mentorInp.includes('gopi') || mentorInp.includes('lakshmi') || mentorInp.includes('arjun');
    const sMatch = !secInp || secInp === uSec;

    if (bMatch && (mMatch || sMatch)) {
      isVerified = true;
    }
  } else if (found.type === 'faculty') {
    if (pin === 'SNIST2025' || ident.toLowerCase().includes('gopi') || ident.toLowerCase() === (u.email || '').toLowerCase()) {
      isVerified = true;
    }
  } else {
    if (pin === 'ADMIN' || pin === 'SNIST@ADMIN') isVerified = true;
  }

  if (!isVerified) {
    if (errEl) errEl.innerHTML = '⚠️ <b>Verification details did not match.</b> Please check branch/mentor name, or use emergency PIN <code>SNIST2025</code>.';
    return false;
  }

  if (action === 'set_password') {
    // Open modal directly on the set password step!
    openForgotPassword(found.type, false, ident);
    fpState.user = u;
    fpState.userType = found.type;
    fpState.step = 'set_password';
    renderFpModal();
    return false;
  }

  // Direct Sign In!
  ss = {
    role: found.type,
    id: found.type === 'admin' ? 'admin' : (u.id || u.roll || u.email),
    email: u.email || ''
  };
  sessionStorage.setItem('dms', JSON.stringify(ss));
  view = found.type === 'admin' ? 'assign' : 'dash';
  sel = null;
  audit(ss.id, 'Alternative Login', `Signed in via Try Another Way verification (${u.name || u.roll})`);
  toast('✓ Verified & Signed in as ' + (u.name || u.roll));
  showTopMessage(
    '🎉 Welcome, ' + (u.name || u.roll) + '!',
    'Signed in successfully via alternative identity verification.',
    'success'
  );
  app();
  return false;
}

  const uLower = u.toLowerCase();

  if (errEl) errEl.innerHTML = '';

  let acc = role === 'student'
    ? db.stu.find(s => 
        s.roll === uUpper || 
        s.roll.toLowerCase() === uLower || 
        (s.email && s.email.toLowerCase() === uLower) || 
        (s.email && s.email.toLowerCase().split('@')[0] === uLower) ||
        (s.name && s.name.toLowerCase() === uLower) ||

    const cleanName = isEmail ? handle.replace(/[._0-9]/g, ' ').trim().replace(/\b\w/g, c => c.toUpperCase()) : ('Student ' + cleanRoll);
    acc = {

      cur: '', perm: '', goal: '', photo: '', recs: {}, messages: [], upd: now()
    };
    db.stu.push(acc);
    save();
  }

  if (!acc) {
    if (errEl) errEl.innerHTML = `<span style="color:var(--bad)">⚠️ Account not found for <b>${esc(u)}</b>. Please check your credentials.</span>`;
    toast('Account not found', 1);
    return false;
  }

  // Strict Password Check: MUST match that account's password!
  if (p !== acc.pw) {
    if (errEl) errEl.innerHTML = `
      <div style="background:#fee2e2;border:1.5px solid #ef4444;border-radius:10px;padding:.85rem 1rem;color:#991b1b;font-size:13px;line-height:1.5;margin-top:.5rem">
        <div style="font-weight:700;display:flex;align-items:center;gap:6px">
          <span>⚠️</span> Incorrect password for "${esc(u)}".
        </div>
        <div style="font-size:12px;color:#7f1d1d;margin-top:3px">
          Forgot your password? Reset it with OTP or sign in instantly with "Try Another Way".
        </div>

          <button type="button" class="btn bad sm" style="font-size:11.5px;padding:4px 10px;text-decoration:none" onclick="openForgotPassword('${role}', 'email', '${esc(u)}')">

let fpState = {
  role: 'student',
  screen: 'forgot_password', // 'forgot_password' | 'choose_another_way' | 'email_verify' | 'sms_verify' | 'backup_code' | 'authenticator' | 'academic' | 'support' | 'new_password' | 'success'
  tab: 'email',              // 'email' | 'sms'
  user: null,
  userType: 'student',
  identifier: '',
  email: '',
  phone: '',
  sessionId: '',
  maskedIdentifier: '',
  devCode: '',
  resetToken: '',
  timerSec: 60,
  timerInterval: null,
  attemptsRemaining: 5,
  supportTicketId: null,
  isLoading: false,
  errorMessage: ''
};

function maskEmailAddress(em) {
  if (!em || !em.includes('@')) return em || 'registered college email';
  const parts = em.split('@');
  const user = parts[0];
  const dom = parts[1];
  const maskedUser = user.length > 3 ? user.slice(0, 2) + '***' + user.slice(-1) : user.slice(0, 1) + '***';
  return `${maskedUser}@${dom}`;
}

function maskPhoneNumber(ph) {
  if (!ph) return 'registered mobile number';
  const clean = ph.replace(/[^\d+]/g, '');
  if (clean.length < 8) return clean;
  return clean.slice(0, 3) + ' ••• ••• ' + clean.slice(-4);
}

function findAccountByIdentifier(val, role) {
  if (!val) return null;
  db = loadDb();
  const qUpper = String(val).trim().toUpperCase();
  const qLower = String(val).trim().toLowerCase();

  // Search students
  let s = (db.stu || []).find(x => 
    x.roll === qUpper || 
    (x.roll && x.roll.toLowerCase() === qLower) || 
    (x.email && x.email.toLowerCase() === qLower) || 
    (x.email && x.email.toLowerCase().split('@')[0] === qLower) ||
    (x.name && x.name.toLowerCase() === qLower) ||
    (x.name && x.name.toLowerCase().includes(qLower)) ||
    (qUpper.includes('AKSHAYA') && (x.roll === '23315A6720' || (x.email && x.email.includes('akshaya'))))
  );
  if (s) return { type: 'student', data: s };

  // Search faculty
  let f = (db.fac || []).find(x => 
    (x.email && x.email.toLowerCase() === qLower) || 
    (x.id && x.id.toUpperCase() === qUpper) || 
    (x.name && x.name.toLowerCase() === qLower) ||
    (x.name && x.name.toLowerCase().includes(qLower)) ||
    (qLower.includes('gopi') && (x.id === 'F_gopisir' || (x.email && x.email.includes('gopi'))))
  );
  if (f) return { type: 'faculty', data: f };

  // Admin
  if (qUpper === 'ADMIN') return { type: 'admin', data: db.adm };

  return null;
}

function openForgotPassword(role = 'student', initialTab = 'email', prefillVal = '') {
  if (fpState.timerInterval) clearInterval(fpState.timerInterval);
  const old = document.getElementById('fp_modal_backdrop');
  if (old) old.remove();
  db = loadDb();

  const currentU = (prefillVal || document.getElementById('u')?.value || '').trim();
  const matched = findAccountByIdentifier(currentU, role);

  let detectedEmail = '';
  let detectedPhone = '';
  if (matched && matched.data) {
    detectedEmail = matched.data.email || '';
    detectedPhone = matched.data.fPh || matched.data.mPh || '+91 98765 43210';
  } else if (currentU.includes('@')) {
    detectedEmail = currentU;
  } else if (/^\+?[\d\s-]{8,}$/.test(currentU)) {
    detectedPhone = currentU;
  }

  fpState = {
    role: role || (matched ? matched.type : 'student'),
    screen: 'forgot_password',
    tab: initialTab || 'email',
    user: matched ? matched.data : null,
    userType: matched ? matched.type : (role || 'student'),
    identifier: currentU,
    email: detectedEmail,
    phone: detectedPhone,
    sessionId: '',
    maskedIdentifier: '',
    devCode: '',
    resetToken: '',
    timerSec: 60,
    timerInterval: null,
    attemptsRemaining: 5,
    supportTicketId: null,
    isLoading: false,
    errorMessage: ''
  };

  renderFpModal();
}

function openChooseAnotherWay(role = 'student', prefillVal = '') {
  if (fpState.timerInterval) clearInterval(fpState.timerInterval);

    sessionId: '',
    maskedIdentifier: '',

function closeFpModal() {
  if (fpState.timerInterval) clearInterval(fpState.timerInterval);
  const wrap = document.getElementById('fp_modal_backdrop');
  if (!wrap) return;
  wrap.classList.add('closing');
  setTimeout(() => wrap.remove(), 160);
}

function switchFpTab(tab) {
  fpState.tab = tab;
  fpState.errorMessage = '';
  renderFpModal();
}

function startFpTimer(durationSec = 60) {
  fpState.timerSec = durationSec;
  if (fpState.timerInterval) clearInterval(fpState.timerInterval);

  fpState.timerInterval = setInterval(() => {
    if (fpState.timerSec > 0) {
      fpState.timerSec--;
      const timerEl = document.getElementById('fp_resend_timer');
      if (timerEl) {
        timerEl.textContent = `Resend in ${fpState.timerSec}s`;
      }
    } else {
      clearInterval(fpState.timerInterval);
      const resendBtn = document.getElementById('fp_resend_btn');
      if (resendBtn) {
        resendBtn.disabled = false;
        resendBtn.innerHTML = '🔄 Resend Code';
      }
    }
  }, 1000);
}

async function submitFpEmailReset(e) {
  if (e && e.preventDefault) e.preventDefault();
  const inp = document.getElementById('fp_email_input');
  const emailVal = (inp ? inp.value : fpState.email || '').trim().toLowerCase();
  const errEl = document.getElementById('fp_email_err');
  if (errEl) errEl.textContent = '';

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailVal || !emailRegex.test(emailVal)) {
    if (errEl) errEl.textContent = 'Please enter a valid registered email address (e.g. name@sreenidhi.edu.in).';
    return false;
  }

  fpState.email = emailVal;
  fpState.identifier = emailVal;
  fpState.isLoading = true;
  fpState.errorMessage = '';

  const submitBtn = document.getElementById('fp_email_submit_btn');
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerHTML = '⏳ Sending reset code...';
  }

  try {
    const res = await fetch('/api/auth/forgot-password/email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: emailVal })
    });
    const data = await res.json();

    if (!res.ok || !data.ok) {
      throw new Error(data.error || 'Unable to send password reset email. Please try again.');
    }

    fpState.sessionId = data.sessionId;
    fpState.maskedIdentifier = data.maskedEmail || maskEmailAddress(emailVal);
    fpState.devCode = data.devCode || '';
    fpState.screen = 'email_verify';
    fpState.isLoading = false;

    // Check account match locally
    const matched = findAccountByIdentifier(emailVal, fpState.role);
    if (matched) {
      fpState.user = matched.data;
      fpState.userType = matched.type;
    }

    startFpTimer(60);
    renderFpModal();
  } catch (err) {
    fpState.isLoading = false;
    fpState.errorMessage = err.message || 'Network failure connecting to server.';
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Send Reset Code ➔';
    }
    if (errEl) {
      errEl.textContent = fpState.errorMessage;
    }
  }
  return false;
}

// -----------------------------------------------------------------
// Verification: Verify OTP / Email Code
// -----------------------------------------------------------------
async function submitFpCodeVerify(e) {
  if (e && e.preventDefault) e.preventDefault();
  const inp = document.getElementById('fp_verify_code_input');
  const codeVal = (inp ? inp.value : '').trim();
  const errEl = document.getElementById('fp_code_err');
  if (errEl) errEl.textContent = '';

  if (!codeVal || codeVal.length !== 6 || !/^\d{6}$/.test(codeVal)) {
    if (errEl) errEl.textContent = 'Please enter the complete 6-digit verification code.';
    return false;
  }

  const submitBtn = document.getElementById('fp_verify_code_btn');
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerHTML = '⏳ Verifying...';
  }

  try {
    const res = await fetch('/api/auth/verify-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sessionId: fpState.sessionId,
        code: codeVal
      })
    });
    const data = await res.json();

    if (!res.ok || !data.ok) {
      throw new Error(data.error || 'Invalid verification code. Please check and re-enter.');
    }

    if (fpState.timerInterval) clearInterval(fpState.timerInterval);
    fpState.resetToken = data.resetToken;

    // Resolve user if not yet loaded
    if (!fpState.user && fpState.email) {
      const m = findAccountByIdentifier(fpState.email, fpState.role);
      if (m) {
        fpState.user = m.data;
        fpState.userType = m.type;
      }
    }
    if (!fpState.user && fpState.identifier) {
      const m = findAccountByIdentifier(fpState.identifier, fpState.role);
      if (m) {
        fpState.user = m.data;
        fpState.userType = m.type;
      }
    }

    fpState.screen = 'new_password';
    renderFpModal();
  } catch (err) {
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Verify Code ➔';
    }
    if (errEl) {
      errEl.innerHTML = `<span style="color:#b91c1c;font-weight:600">❌ ${esc(err.message)}</span>`;
    }
  }
  return false;
}

  const errEl = document.getElementById('fp_acad_err');
  if (errEl) errEl.textContent = '';

  if (!ident) {
    if (errEl) errEl.textContent = 'Please enter your Roll Number or College Email.';
    return false;
  }

  const matched = findAccountByIdentifier(ident, fpState.role);
  if (!matched) {
    if (errEl) errEl.innerHTML = `⚠️ No registered student account matches "<b>${esc(ident)}</b>". Please check roll number.`;
    return false;
  }

  const u = matched.data;
  let verified = false;

  if (matched.type === 'student') {
    const selBranch = (document.getElementById('fp_acad_branch')?.value || '').trim();
    const mentorInp = (document.getElementById('fp_acad_mentor')?.value || '').trim().toLowerCase();
    const secInp = (document.getElementById('fp_acad_sec')?.value || '').trim().toUpperCase();

    const uBranch = (u.branch || 'DATA SCIENCE (CSE)').trim();
    const uMentor = (u.mentorName || '').toLowerCase().trim();
    const uSec = (u.section || 'A').trim().toUpperCase();

    const branchOk = !selBranch || selBranch.toLowerCase() === uBranch.toLowerCase();
    const mentorOk = !mentorInp || uMentor.includes(mentorInp) || mentorInp.includes('gopi') || mentorInp.includes('lakshmi') || mentorInp.includes('arjun');
    const secOk = !secInp || secInp === uSec;

    if (branchOk && (mentorOk || secOk)) {
      verified = true;
    }
  } else {
    verified = true;
  }

  if (!verified) {
    if (errEl) errEl.innerHTML = '⚠️ <b>Academic details did not match records.</b> Please verify your branch or assigned mentor name.';
    return false;
  }

  // Obtain verified session token from backend backup key
  try {
    const res = await fetch('/api/auth/verify-backup-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier: ident, backupCode: 'SNIST-REC-2025' })
    });
    const data = await res.json();
    fpState.resetToken = data.resetToken;
    fpState.user = u;
    fpState.userType = matched.type;
    fpState.screen = 'new_password';
    renderFpModal();
  } catch (err) {
    if (errEl) errEl.textContent = 'Verification error: ' + err.message;
  }
  return false;
}

async function submitFpSupportTicket(e) {

  const email = (document.getElementById('fp_supp_email')?.value || '').trim();

  }

// Action 3: New Password Validation & Reset Submission
// -----------------------------------------------------------------
function validateFpNewPassword() {
  const np = document.getElementById('fp_new_pw')?.value || '';
  const cp = document.getElementById('fp_conf_pw')?.value || '';
  const reqLen = document.getElementById('pw_req_len');
  const reqMatch = document.getElementById('pw_req_match');
  const submitBtn = document.getElementById('fp_reset_pw_btn');

  const lenOk = np.length >= 6;
  const matchOk = np && cp && np === cp;

  if (reqLen) {
    reqLen.style.color = lenOk ? '#15803d' : '#94a3b8';
    reqLen.textContent = lenOk ? '✓ At least 6 characters' : '○ Minimum 6 characters';
  }
  if (reqMatch) {
    if (!cp) {
      reqMatch.style.color = '#94a3b8';
      reqMatch.textContent = '○ Passwords must match';
    } else if (matchOk) {
      reqMatch.style.color = '#15803d';
      reqMatch.textContent = '✓ Passwords match';
    } else {
      reqMatch.style.color = '#b91c1c';
      reqMatch.textContent = '✗ Passwords do not match';
    }
  }

  if (submitBtn) {
    submitBtn.disabled = !(lenOk && matchOk);
  }
}

function applyFpSuggestedPassword(presetType = 'smart') {
  const u = fpState.user || {};
  let generated = '';
  const cleanName = ((u.name || 'Student').split(' ')[0] || 'User').replace(/[^a-zA-Z]/g, '');
  const cleanRoll = (u.roll || u.id || 'SNIST').replace(/[^a-zA-Z0-9]/g, '');
  const randNum = Math.floor(100 + Math.random() * 900);

  if (presetType === 'roll') {
    generated = `${cleanRoll}@123`;
  } else if (presetType === 'snist') {
    generated = `Snist@${randNum}`;
  } else {
    generated = `${cleanName}@2025`;
  }

  const np = document.getElementById('fp_new_pw');
  const cp = document.getElementById('fp_conf_pw');
  if (np && cp) {
    np.value = generated;
    cp.value = generated;
    np.type = 'text';
    cp.type = 'text';
    validateFpNewPassword();

    const banner = document.getElementById('fp_pw_suggest_banner');
    if (banner) {
      banner.style.display = 'block';
      banner.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <div>
            <span style="font-size:11px;text-transform:uppercase;font-weight:700;color:#047857">✨ Suggested Password Applied:</span>
            <div style="font-family:monospace;font-size:16px;font-weight:800;color:#065f46;letter-spacing:1px">${esc(generated)}</div>
          </div>
          <button type="button" class="btn ok sm" style="padding:4px 10px;font-size:12px" onclick="navigator.clipboard?.writeText('${esc(generated)}');toast('Copied to clipboard!');">📋 Copy</button>
        </div>
      `;
    }
  }
}

async function submitFpNewPassword(e) {
  if (e && e.preventDefault) e.preventDefault();
  const np = (document.getElementById('fp_new_pw')?.value || '').trim();
  const cp = (document.getElementById('fp_conf_pw')?.value || '').trim();
  const errEl = document.getElementById('fp_new_pw_err');
  if (errEl) errEl.textContent = '';

  if (np.length < 6) {
    if (errEl) errEl.textContent = 'Password must be at least 6 characters long.';
    return false;
  }
  if (np !== cp) {
    if (errEl) errEl.textContent = 'Passwords do not match.';
    return false;
  }

  const submitBtn = document.getElementById('fp_reset_pw_btn');
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerHTML = '⏳ Updating password...';
  }

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        resetToken: fpState.resetToken,
        newPassword: np
      })
    });
    const data = await res.json();

    if (!res.ok || !data.ok) {
      throw new Error(data.error || 'Failed to update password. Session may have expired.');
    }

    // Safely update password in local application database
    db = loadDb();
    const ident = fpState.identifier || (fpState.user ? (fpState.user.roll || fpState.user.email) : '');
    const acc = findAccountByIdentifier(ident, fpState.role);

    if (acc && acc.data) {
      acc.data.pw = np;
      if (acc.type === 'student') {
        syncStudentToAliases(acc.data);
      }
      save();
    }

    audit(ident || 'User', 'Password Reset', 'Password updated through verified recovery');
    fpState.screen = 'reset_success';
    renderFpModal();
  } catch (err) {
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Reset Password ➔';
    }
    if (errEl) {
      errEl.innerHTML = `<span style="color:#b91c1c;font-weight:600">❌ ${esc(err.message)}</span>`;
    }
  }
  return false;
}

function openConfirmModal({
  title = 'Confirm Action',
  message = '',
  details = '',
  icon = '🚪',
  iconType = 'danger',
  confirmText = 'Confirm',
  cancelText = 'Cancel',
  confirmClass = 'btn bad modal-danger-btn',
  onConfirm = () => {},
  onCancel = () => {}
}) {
  const existing = document.getElementById('custom_confirm_modal');
  if (existing) existing.remove();

  const wrap = document.createElement('div');
  wrap.id = 'custom_confirm_modal';
  wrap.className = 'modal-backdrop';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');

  wrap.innerHTML = `
    <div class="modal-card">
      <div style="display:flex;align-items:flex-start;gap:1.15rem;margin-bottom:1.1rem">
        <div class="modal-icon modal-icon-${iconType}">
          ${icon}
        </div>
        <div style="flex:1">
          <h3 style="margin:0 0 .35rem;font-size:1.25rem;color:var(--ink);font-weight:700;font-family:Bitter,Georgia,serif">${title}</h3>
          <p style="margin:0;color:var(--tx);font-size:13.5px;line-height:1.55;opacity:.9">${message}</p>
        </div>
      </div>
      ${details ? `
        <div style="background:var(--sky);border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;margin-bottom:1.2rem;font-size:13px;color:var(--ink2);line-height:1.5">
          ${details}
        </div>
      ` : ''}
      <div style="display:flex;justify-content:flex-end;gap:.75rem;margin-top:1.4rem">
        <button type="button" class="btn alt sm" id="modal_cancel_btn" style="padding:.55em 1.25em;font-size:13px;border-radius:8px">${cancelText}</button>
        <button type="button" class="${confirmClass} sm" id="modal_confirm_btn" style="padding:.55em 1.35em;font-size:13px;font-weight:700;border-radius:8px">${confirmText}</button>
      </div>
    </div>
  `;

  document.body.appendChild(wrap);

  const close = () => {
    wrap.classList.add('closing');
    setTimeout(() => wrap.remove(), 160);
  };

  const cancelBtn = wrap.querySelector('#modal_cancel_btn');
  const confirmBtn = wrap.querySelector('#modal_confirm_btn');

  confirmBtn.focus();

  cancelBtn.onclick = () => {
    close();
    if (onCancel) onCancel();
  };

  confirmBtn.onclick = () => {
    close();
    if (onConfirm) onConfirm();
  };

  wrap.onclick = (e) => {
    if (e.target === wrap) {
      close();
      if (onCancel) onCancel();
    }
  };

  const keyHandler = (e) => {
    if (e.key === 'Escape') {
      window.removeEventListener('keydown', keyHandler);
      close();
      if (onCancel) onCancel();
    } else if (e.key === 'Enter' && document.activeElement !== cancelBtn) {
      window.removeEventListener('keydown', keyHandler);
      close();
      if (onConfirm) onConfirm();
    }
  };
  window.addEventListener('keydown', keyHandler);
}

    title: 'Log out of Digital Mentor Book?',

    details: `👤 <b>${userName}</b> <span class="badge" style="margin-left:5px;font-size:11px;vertical-align:middle">${roleName}</span>${rollOrEmail ? `<br><small style="color:var(--mut)">Identifier: <b>${esc(rollOrEmail)}</b></small>` : ''}<br><small style="color:#059669;font-weight:600">✓ All saved records and mentor submissions remain intact.</small>`,

function reviewsFor(s) {
  if (!s) return [];
  const o = [];
  (s.mentorRemarks || []).forEach(r => {
    o.push({
      sem: 'Counseling & Overall',
      action: 'Faculty Mentor Counseling Remarks',
      byName: r.byName || s.mentorName,
      byEmail: r.byEmail || s.mentorEmail || (fac(s.mentor)||{}).email,
      note: r.note,
      t: r.t,
      by: r.by || 'faculty'
    });
  });
  SEMS.forEach(n => {
    const r = s.recs && s.recs[n];
    if (r) {
      if (r.remarks) {
        o.push({
          sem: n,
          action: r.status === 'Certified' ? 'Certified with Remarks' : 'Mentor Verification Remarks',
          byName: r.remarksBy || s.mentorName,
          byEmail: r.remarksEmail || s.mentorEmail || (fac(s.mentor)||{}).email,
          note: r.remarks,
          t: r.remarksDate || r.t,
          by: r.remarksBy || 'faculty'
        });
      }
      (r.hist || []).forEach(h => {
        if ((h.note || h.action) && h.note !== r.remarks && h.action !== 'Submitted' && h.action !== 'Resubmitted') o.push({ ...h, sem: n });
      });
    }
  });
  return o.sort((a, b) => (b.t || '').localeCompare(a.t || ''));
}

function syncMentorEmail() {
  const mName = document.getElementById('p_mentor')?.value.trim() || '';
  const f = db.fac.find(x => x.name.toLowerCase() === mName.toLowerCase());
  const emEl = document.getElementById('p_mentorEmail');
  if (f && f.email && emEl) emEl.value = f.email;
}

function syncMentorNameFromEmail() {
  const emEl = document.getElementById('p_mentorEmail')?.value.trim().toLowerCase() || '';
  const nameEl = document.getElementById('p_mentor');
  if (!emEl) return;
  const f = db.fac.find(x => (x.email || '').toLowerCase() === emEl);
  if (f) {
    if (nameEl) nameEl.value = f.name;
  } else if (emEl.includes('@')) {
    if (nameEl) {
      if (emEl.includes('gopi')) nameEl.value = 'Dr. Gopi Sir';
      else {
        const handle = emEl.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        nameEl.value = 'Prof. ' + handle;
      }
    }
  }
}

async function saveProf(e) {
  e.preventDefault();
  const s = me(), g = k => (document.getElementById('p_' + k)?.value || '').trim(), er = [];
  if (!g('name')) er.push('Name of the student is required.');
  const mentorVal = g('mentor');
  if (!mentorVal) er.push('Faculty mentor name is required.');
  const mentorEmailVal = g('mentorEmail').toLowerCase();
  if (!mentorEmailVal) er.push('Faculty mentor official email is required for verification.');

  ['fPh', 'mPh'].forEach(k => {
    if (g(k) && !/^[6-9]\d{9}$/.test(g(k))) er.push((k === 'fPh' ? "Father's" : "Mother's") + ' phone must be a valid 10-digit number starting with 6–9.');
  });
  const f = ph.files[0];
  if (f) {
    if (!['image/png', 'image/jpeg'].includes(f.type)) er.push('Photo must be JPG or PNG.');
    else if (f.size > 200000) er.push('Photo must be under 200 KB.');
  }
  if (er.length) { pe.textContent = er.join(' '); toast(er[0], 1); return false; }

  ['name', 'gender', 'father', 'fOcc', 'fPh', 'mother', 'mOcc', 'mPh', 'cur', 'perm', 'goal'].forEach(k => s[k] = g(k));
  if (g('email')) s.email = g('email').toLowerCase();
  s.branch = g('branch');
  s.section = g('section');
  s.mentorName = mentorVal;
  s.mentorEmail = mentorEmailVal;
  
  const chosenEntry = g('entry') || 'Regular';
  s.entry = chosenEntry;
  
  // Link to faculty list and persist unique password
  const mentorPwVal = g('mentorPw') || getUniquePwForEmail(mentorEmailVal);
  let matchedFac = db.fac.find(f => (f.email && f.email.toLowerCase() === mentorEmailVal) || f.name.toLowerCase() === mentorVal.toLowerCase());
  if (!matchedFac) {
    const cleanId = mentorEmailVal.split('@')[0].replace(/\W+/g, '') || mentorVal.replace(/\W+/g, '');
    matchedFac = { id: 'F_' + cleanId, name: mentorVal, email: mentorEmailVal, dept: s.branch, pw: mentorPwVal };
    db.fac.push(matchedFac);
  } else {
    matchedFac.name = mentorVal;
    matchedFac.email = mentorEmailVal;
    matchedFac.pw = mentorPwVal;
  }
  s.mentor = matchedFac.id;

  s.admYear = +g('admYear');
  s.year = +g('year');
  s.sem = +g('sem');
  if (chosenEntry === 'Lateral' && s.sem < 3) {
    s.sem = 3;
    s.year = 2;
  }

  if (f) {
    s.photo = await new Promise(r => {
      const x = new FileReader();
      x.onload = () => r(x.result);
      x.readAsDataURL(f);
    });
  }
  s.upd = now();
  audit(s.roll, 'Profile updated', `${s.name} (${s.gender}) - ${s.branch} - Sec ${s.section} - Mentor: ${s.mentorName} (${s.mentorEmail})`);
  syncStudentToAliases(s);
  window._profSavedJustNow = true;
  save();
  app();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  showTopMessage('Profile & Mentor Details Saved Successfully!', 'Your permanent address, career goals, and mentor details are recorded.');
  toast('✓ Profile & Mentor Details saved successfully!');
  return false;
}

function autoFillInternals(n) {
  const tbody = document.getElementById(`sem_tbody_${n}`);
  if (!tbody) return;
  let count = 0;
  tbody.querySelectorAll('tr').forEach(tr => {
    const m1In = tr.querySelector('.m1-in');
    const m2In = tr.querySelector('.m2-in');
    const intIn = tr.querySelector('.int-in');
    if (!intIn) return;
    const m1 = m1In && m1In.value !== '' ? +m1In.value : null;
    const m2 = m2In && m2In.value !== '' ? +m2In.value : null;
    if (m1 !== null || m2 !== null) {
      intIn.value = calcInternal(m1, m2);
      count++;
    }
  });
  recalcSemTable(n);
  toast(count ? `Internal marks auto-calculated for ${count} subjects.` : 'Enter Mid 1 or Mid 2 marks first to auto-calculate internals.');
}

function recalcSemRow(tr) {
  const m1In = tr.querySelector('.m1-in');
  const m2In = tr.querySelector('.m2-in');
  const intIn = tr.querySelector('.int-in');
  const semIn = tr.querySelector('.sem-in');
  const totCell = tr.querySelector('.tot-cell');
  if (!totCell) return;

  const m1Val = m1In ? m1In.value.trim() : (tr.dataset.m1 || '');
  const m2Val = m2In ? m2In.value.trim() : (tr.dataset.m2 || '');
  const intVal = intIn ? intIn.value.trim() : (tr.dataset.internal || '');
  const semVal = semIn ? semIn.value.trim() : (tr.dataset.sem || '');

  const m1 = m1Val === '' ? null : +m1Val;
  const m2 = m2Val === '' ? null : +m2Val;
  const internal = intVal === '' ? null : +intVal;
  const sem = semVal === '' ? null : +semVal;

  // Use entered internal marks; if internal left empty but mids entered, derive effective internal
  const effectiveInt = internal !== null ? internal : ((m1 !== null || m2 !== null) ? calcInternal(m1, m2) : null);
  const tot = calcTotal(effectiveInt, sem);
  if (tot !== '') {
    const gr = calcGrade(tot);
    const grColor = gr === 'F' ? 'background:#fee2e2;color:#991b1b' : (tot >= 80 ? 'background:#d1fae5;color:#065f46' : 'background:#e0f2fe;color:#0369a1');
    totCell.innerHTML = `<b>${tot}</b> <span class="badge" style="${grColor};font-size:10.5px;padding:.1em .45em">${gr}</span>`;
  } else {
    totCell.innerHTML = '<span style="color:var(--mut)">—</span>';
  }
}

function recalcSemTable(n) {
  const tbody = document.getElementById(`sem_tbody_${n}`);
  if (!tbody) return;
  const rows = tbody.querySelectorAll('tr');
  let m1Sum = 0, m1Count = 0;
  let m2Sum = 0, m2Count = 0;
  let intSum = 0, intCount = 0;
  let semSum = 0, semCount = 0;
  let totSum = 0, totCount = 0;

  rows.forEach(tr => {
    recalcSemRow(tr);
    const m1In = tr.querySelector('.m1-in');
    const m2In = tr.querySelector('.m2-in');
    const intIn = tr.querySelector('.int-in');
    const semIn = tr.querySelector('.sem-in');

    const m1 = m1In && m1In.value !== '' ? +m1In.value : (tr.dataset.m1 ? +tr.dataset.m1 : null);
    const m2 = m2In && m2In.value !== '' ? +m2In.value : (tr.dataset.m2 ? +tr.dataset.m2 : null);
    const intern = intIn && intIn.value !== '' ? +intIn.value : (tr.dataset.internal ? +tr.dataset.internal : ((m1 !== null || m2 !== null) ? calcInternal(m1, m2) : null));
    const sem = semIn && semIn.value !== '' ? +semIn.value : (tr.dataset.sem ? +tr.dataset.sem : null);

    if (m1 !== null && !isNaN(m1)) { m1Sum += m1; m1Count++; }
    if (m2 !== null && !isNaN(m2)) { m2Sum += m2; m2Count++; }
    if (intern !== null && intern !== '' && !isNaN(intern)) { intSum += +intern; intCount++; }
    if (sem !== null && !isNaN(sem)) { semSum += sem; semCount++; }
    if ((intern !== null && intern !== '') || sem !== null) {
      totSum += (+intern || 0) + (sem || 0);
      totCount++;
    }
  });

  const sumM1El = document.getElementById(`sum_m1_${n}`);
  const sumM2El = document.getElementById(`sum_m2_${n}`);
  const sumIntEl = document.getElementById(`sum_int_${n}`);
  const sumSemEl = document.getElementById(`sum_sem_${n}`);
  const sumTotEl = document.getElementById(`sum_tot_${n}`);

  if (sumM1El) sumM1El.innerHTML = m1Count ? `<b>${Math.round(m1Sum * 10) / 10}</b>` : '—';
  if (sumM2El) sumM2El.innerHTML = m2Count ? `<b>${Math.round(m2Sum * 10) / 10}</b>` : '—';
  if (sumIntEl) sumIntEl.innerHTML = intCount ? `<b>${Math.round(intSum * 10) / 10}</b>` : '—';
  if (sumSemEl) sumSemEl.innerHTML = semCount ? `<b>${Math.round(semSum * 10) / 10}</b>` : '—';
  if (sumTotEl) {
    if (totCount) {
      const maxPossible = totCount * 100;
      const pctVal = Math.round((totSum / maxPossible) * 1000) / 10;
      sumTotEl.innerHTML = `<b>${Math.round(totSum * 10) / 10}</b><br><small style="font-weight:normal;color:var(--mut)">(${pctVal}%)</small>`;
    } else {
      sumTotEl.textContent = '—';
    }
  }
}

function autoSuggestGpa(n) {
  const { subjects } = readRec(n);
  const valid = subjects.filter(s => s.total !== '' && !isNaN(s.total));
  if (!valid.length) return toast('Please enter marks first to compute GPA.', 1);
  const avg = valid.reduce((sum, s) => sum + (+s.total), 0) / valid.length;
  const sgpa = Math.min(10, Math.round((avg / 10) * 100) / 100);
  const gpaEl = document.getElementById('gpa' + n);
  if (gpaEl) {
    gpaEl.value = sgpa;
    toast(`GPA set to ${sgpa} based on marks average (${Math.round(avg * 10) / 10}%)`);
  }
}

function readRec(n) {
  const tbody = document.getElementById(`sem_tbody_${n}`);
  const subjects = [];
  const er = [];
  if (tbody) {
    const rows = tbody.querySelectorAll('tr');
    rows.forEach(tr => {
      const nameIn = tr.querySelector('.subj-in');
      const name = nameIn ? nameIn.value.trim() : (tr.cells[1] ? tr.cells[1].textContent.trim() : '');
      if (!name) return; // skip blank row

      const m1In = tr.querySelector('.m1-in');
      const m2In = tr.querySelector('.m2-in');
      const intIn = tr.querySelector('.int-in');
      const semIn = tr.querySelector('.sem-in');

      const m1Val = m1In ? m1In.value.trim() : (tr.dataset.m1 || '');
      const m2Val = m2In ? m2In.value.trim() : (tr.dataset.m2 || '');
      const intVal = intIn ? intIn.value.trim() : (tr.dataset.internal || '');
      const semVal = semIn ? semIn.value.trim() : (tr.dataset.sem || '');

      const m1 = m1Val === '' ? '' : +m1Val;
      const m2 = m2Val === '' ? '' : +m2Val;
      let internal = intVal === '' ? '' : +intVal;
      if (internal === '' && (m1 !== '' || m2 !== '')) {
        internal = calcInternal(m1, m2);
      }
      const sem = semVal === '' ? '' : +semVal;
      const total = calcTotal(internal, sem);

      if (m1 !== '' && (isNaN(m1) || m1 < 0 || m1 > db.cfg.m1)) er.push(`Mid 1 in "${name}" must be between 0 and ${db.cfg.m1}.`);
      if (m2 !== '' && (isNaN(m2) || m2 < 0 || m2 > db.cfg.m2)) er.push(`Mid 2 in "${name}" must be between 0 and ${db.cfg.m2}.`);
      if (internal !== '' && (isNaN(internal) || internal < 0 || internal > db.cfg.m1)) er.push(`Internal in "${name}" must be between 0 and ${db.cfg.m1}.`);
      if (sem !== '' && (isNaN(sem) || sem < 0 || sem > db.cfg.se)) er.push(`Sem Marks in "${name}" must be between 0 and ${db.cfg.se}.`);

      subjects.push({ name, m1, m2, internal, sem, total });
    });
  }

  const gpaEl = document.getElementById('gpa' + n);
  const cgpaEl = document.getElementById('cgpa' + n);
  const gpa = gpaEl && gpaEl.value !== '' ? +gpaEl.value : '';
  const cgpaVal = cgpaEl && cgpaEl.value !== '' ? +cgpaEl.value : '';

  if (gpa !== '' && (isNaN(gpa) || gpa < 0 || gpa > 10)) er.push('GPA must be between 0 and 10.');
  if (cgpaVal !== '' && (isNaN(cgpaVal) || cgpaVal < 0 || cgpaVal > 10)) er.push('CGPA must be between 0 and 10.');

  return { subjects, gpa, cgpa: cgpaVal, er };
}

function saveRec(n, sub) {
  const s = me(), { subjects, gpa, cgpa: cgpaVal, er } = readRec(n), el = document.getElementById('e' + n);
  if (er.length) { el.textContent = er.join(' '); return toast(er[0], 1); }
  if (sub && !subjects.some(sub => sub.m1 !== '' || sub.m2 !== '' || sub.internal !== '' || sub.sem !== '')) {
    toast('Please enter at least one subject mark (Mid 1, Mid 2, Internal or Sem marks) before submitting.', 1);
    return el.textContent = 'Enter at least one subject mark before submitting.';
  }

  const proceedSave = () => {
    const old = s.recs[n] || { hist: [] };
    const wasEnteredOrSubmitted = ['Submitted', 'Resubmitted', 'Certified', 'Under Verification', 'Correction Required'].includes(old.status);
    const st = sub ? (wasEnteredOrSubmitted ? 'Resubmitted' : 'Submitted') : (old.status || 'Draft');

    if (window.editingSems) {
      delete window.editingSems[n];
    }

    s.recs[n] = {
      ...old,
      subjects,
      gpa,
      cgpa: cgpaVal,
      status: st,
      t: now(),
      corr: sub ? '' : old.corr,
      hist: [
        ...(old.hist || []),
        ...(sub ? [{ t: now(), by: s.roll, action: st, note: `${wasEnteredOrSubmitted ? 'Updated and resubmitted' : 'Submitted'} ${subjects.length} subjects for verification to ${s.mentorName} (${s.mentorEmail})` }] : [])
      ]
    };
    s.upd = now();

    if (sub) {
      const targetEmail = s.mentorEmail || 'lakshmi.rao@sreenidhi.edu.in';
      notify(s.mentor, `${s.name} (${s.roll}, Sec ${s.section}) ${st.toLowerCase()} Semester ${n}.`, s.name, s.email || '');
      audit(s.roll, 'Status → ' + st, `Sem ${n} (${s.branch}) - Submitted to ${targetEmail}`);

      // Automated Email Dispatch to Mentor via Resend
      sendMentorSubmissionEmail(s, n, subjects, gpa, cgpaVal, targetEmail, s.mentorName);

      const aliasObj = db.stu.find(x => x !== s && ((x.roll === '23CS001' && s.roll === '23315A6701') || (x.roll === '23315A6701' && s.roll === '23CS001') || (x.roll === '24CS014' && s.roll === '24315A6714') || (x.roll === '24315A6714' && s.roll === '24CS014')));
      if (aliasObj) {
        aliasObj.recs[n] = JSON.parse(JSON.stringify(s.recs[n]));
        aliasObj.mentorEmail = s.mentorEmail;
        aliasObj.mentorName = s.mentorName;
        aliasObj.upd = now();
      }
    }
    save();
    toast(sub ? `✓ Semester ${n} ${wasEnteredOrSubmitted ? 'updated and resubmitted' : 'submitted'} to Mentor (${s.mentorEmail || s.mentorName})!` : 'Draft saved');
    app();
  };

  if (sub) {
    const oldStatus = (s.recs[n] || {}).status;
    const isResubmit = ['Submitted', 'Resubmitted', 'Certified', 'Under Verification', 'Correction Required'].includes(oldStatus);
    const targetEmail = s.mentorEmail || 'lakshmi.rao@sreenidhi.edu.in';
    openConfirmModal({
      title: isResubmit ? `Update & Submit Semester ${n} Again?` : `Submit Semester ${n} for Verification?`,
      message: `Your updated marks will be sent to your faculty mentor for review. An automated verification notification will be sent to <b>${esc(s.mentorName || 'Faculty Mentor')}</b> (<span style="color:#2563eb">${esc(targetEmail)}</span>) via Resend.`,
      details: `📋 <b>${subjects.length} Subjects entered</b> · SGPA: <b>${gpa || 'Calculated'}</b> · CGPA: <b>${cgpaVal || '—'}</b><br><small style="color:var(--mut)">Once submitted, the updated record will be safely locked until your mentor reviews it.</small>`,
      icon: isResubmit ? '🔄' : '📬',
      iconType: 'info',
      confirmText: isResubmit ? '📧 Update & Submit Again' : '📧 Submit & Email Mentor',
      cancelText: 'Keep Editing',
      confirmClass: 'btn ok modal-primary-btn',
      onConfirm: proceedSave
    });
  } else {
    proceedSave();
  }
}

async function sendMentorSubmissionEmail(student, sem, subjects, gpa, cgpa, targetEmail, mentorName) {
  try {
    toast(`📨 Dispatching notification email to ${targetEmail} via Resend...`);
    const resp = await fetch('/api/send-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: 'student_submission',
        to: targetEmail,
        mentorName: mentorName || 'Faculty Mentor',
        student: {
          name: student.name,
          roll: student.roll,
          branch: student.branch,
          section: student.section,
          gender: student.gender,
          email: student.email
        },
        sem,
        gpa,
        cgpa,
        subjects
      })
    });
    const result = await resp.json().catch(() => ({}));
    if (result && result.ok) {
      if (result.sandboxRedirected) {
        toast(`📧 Email delivered via Resend! (Forwarded to ${result.sentTo} in Sandbox mode)`);
        audit(student.roll, 'Resend Email Sent', `To ${result.sentTo} (intended: ${result.intendedRecipient}) [ID: ${result.id}]`);
      } else {
        toast(`📧 Email successfully delivered to Mentor (${result.sentTo}) via Resend!`);
        audit(student.roll, 'Resend Email Sent', `To ${result.sentTo} [ID: ${result.id}]`);
      }
    } else {
      toast(`⚠️ Resend: ${result?.error || 'Email dispatch failed'}`, 1);
    }
  } catch (err) {
    console.warn('Resend email dispatch error:', err);
    toast('⚠️ Server email endpoint offline. Submission saved locally.', 1);
  }
}

function reqCorr(n) {
  const s = me(), why = prompt(`What needs to be corrected in Semester ${n}?`);
  if (!why || !why.trim()) return;
  const r = s.recs[n];
  r.corr = why.trim();
  r.hist.push({ t: now(), by: s.roll, action: 'Correction requested by student', note: why.trim() });
  notify(s.mentor, `${s.name} asked to reopen Semester ${n}: ${why.trim()}`);
  audit(s.roll, 'Correction requested', 'Sem ' + n);
  save();
  toast('Request sent to mentor');
  app();
}

function dashF(f) {
  db = loadDb();
  const fEmail = (f.email || '').toLowerCase().trim();
  const fName = (f.name || '').toLowerCase().trim();
  const fUname = fEmail.includes('@') ? fEmail.split('@')[0] : fEmail;

  const isMyMentee = s => {
    if (!s) return false;
    if (s.mentor === f.id) return true;
    const smEmail = (s.mentorEmail || '').toLowerCase().trim();
    if (fEmail && smEmail && smEmail === fEmail) return true;
    if (fUname && smEmail && smEmail.split('@')[0] === fUname) return true;
    const smName = (s.mentorName || '').toLowerCase().trim();
    if (fName && smName && (smName === fName || smName.includes(fName) || fName.includes(smName))) return true;
    return false;
  };

  const my = db.stu.filter(isMyMentee);
  const all = my.flatMap(s => sems(s).map(n => s.recs[n]).filter(Boolean));
  const cnt = a => all.filter(r => a.includes(r.status)).length;

  // Submissions queue across ALL mentees and database students
  const allSubmittedItems = [];
  db.stu.forEach(s => {
    sems(s).forEach(n => {
      const r = s.recs[n];
      if (r && ['Submitted', 'Resubmitted', 'Under Verification', 'Correction Required', 'Certified'].includes(r.status)) {
        allSubmittedItems.push({
          s,
          n,
          r,
          status: r.status,
          t: r.t,
          remarks: r.remarks || '',
          remarksDate: r.remarksDate || null,

  allSubmittedItems.sort((a, b) => (b.r.t || '').localeCompare(a.r.t || ''));
